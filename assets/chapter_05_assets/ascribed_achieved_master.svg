<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Ascribed, achieved, and master statuses held by one person</title>
  <desc id="desc">A single person holds ascribed statuses such as sex, age, and nationality, and achieved statuses such as student and team captain; a master status is whichever dominates the others.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#FCFCFA"/>
  <text x="600" y="56" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B2A4A">ONE PERSON, MANY STATUSES</text><circle cx="600" cy="261.8" r="28.6" fill="#1B2A4A" stroke="none" stroke-width="2"/><path d="M 600 299.2 L 600 382.8 M 547.2 334.4 L 600 312.4 L 652.8 334.4 M 600 382.8 L 556.0 448.8 M 600 382.8 L 644.0 448.8" fill="none" stroke="#1B2A4A" stroke-width="15.400000000000002" stroke-linecap="round" stroke-linejoin="round" /><text x="600" y="470" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#6F7985">the same person</text><line x1="392" y1="169" x2="530" y2="300" stroke="#147D79" stroke-width="2" stroke-linecap="round"/><rect x="90" y="145" width="300" height="48" rx="14" fill="#EAF6F5" stroke="#147D79" stroke-width="2" /><text x="240" y="177" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#25313D">Female</text><line x1="392" y1="231" x2="530" y2="300" stroke="#147D79" stroke-width="2" stroke-linecap="round"/><rect x="90" y="207" width="300" height="48" rx="14" fill="#EAF6F5" stroke="#147D79" stroke-width="2" /><text x="240" y="239" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#25313D">Age 20</text><line x1="392" y1="293" x2="530" y2="300" stroke="#147D79" stroke-width="2" stroke-linecap="round"/><rect x="90" y="269" width="300" height="48" rx="14" fill="#EAF6F5" stroke="#147D79" stroke-width="2" /><text x="240" y="301" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#25313D">Daughter</text><line x1="392" y1="355" x2="530" y2="300" stroke="#147D79" stroke-width="2" stroke-linecap="round"/><rect x="90" y="331" width="300" height="48" rx="14" fill="#EAF6F5" stroke="#147D79" stroke-width="2" /><text x="240" y="363" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#25313D">Kuwaiti national</text><line x1="392" y1="417" x2="530" y2="300" stroke="#147D79" stroke-width="2" stroke-linecap="round"/><rect x="90" y="393" width="300" height="48" rx="14" fill="#EAF6F5" stroke="#147D79" stroke-width="2" /><text x="240" y="425" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#25313D">Family’s religion</text><line x1="808" y1="169" x2="670" y2="300" stroke="#A47712" stroke-width="2" stroke-linecap="round"/><rect x="810" y="145" width="300" height="48" rx="14" fill="#FFF7E3" stroke="#A47712" stroke-width="2" /><text x="960" y="177" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#25313D">University student</text><line x1="808" y1="231" x2="670" y2="300" stroke="#A47712" stroke-width="2" stroke-linecap="round"/><rect x="810" y="207" width="300" height="48" rx="14" fill="#FFF7E3" stroke="#A47712" stroke-width="2" /><text x="960" y="239" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#25313D">Pharmacy major</text><line x1="808" y1="293" x2="670" y2="300" stroke="#A47712" stroke-width="2" stroke-linecap="round"/><rect x="810" y="269" width="300" height="48" rx="14" fill="#FFF7E3" stroke="#A47712" stroke-width="2" /><text x="960" y="301" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#25313D">Part-time tutor</text><line x1="808" y1="355" x2="670" y2="300" stroke="#A47712" stroke-width="2" stroke-linecap="round"/><rect x="810" y="331" width="300" height="48" rx="14" fill="#FFF7E3" stroke="#A47712" stroke-width="2" /><text x="960" y="363" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#25313D">Team captain</text><line x1="808" y1="417" x2="670" y2="300" stroke="#A47712" stroke-width="2" stroke-linecap="round"/><rect x="810" y="393" width="300" height="48" rx="14" fill="#FFF7E3" stroke="#A47712" stroke-width="2" /><text x="960" y="425" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#25313D">Volunteer</text><text x="240" y="100" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#147D79">ASCRIBED</text><text x="240" y="124" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#6F7985">assigned by society, usually at birth</text><text x="960" y="100" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#A47712">ACHIEVED</text><text x="960" y="124" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#6F7985">attained largely through one’s own efforts</text><rect x="120" y="505" width="960" height="70" rx="18" fill="#F9E9E6" stroke="#C65D4B" stroke-width="2" /><text x="600" y="535" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#1B2A4A"><tspan x="600" dy="0">MASTER STATUS: whichever of these comes to dominate the others and determine</tspan><tspan x="600" dy="24">the person’s general position in society (Hughes 1945). It can be ascribed or achieved.</tspan></text><text x="600" y="620" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#6F7985">Illustrative statuses; religion is listed as ascribed on the assumption that the person continued the family’s faith (Foladare 1969).</text>
</svg>
