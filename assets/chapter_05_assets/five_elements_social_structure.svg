<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">The five elements of social structure</title>
  <desc id="desc">A frame labelled social structure, in which all social interaction takes place, contains five numbered tiles: statuses, social roles, groups, social networks, and social institutions, each with a one-line definition.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="560" fill="#FCFCFA"/>
  <rect x="30" y="20" width="1140" height="520" rx="28" fill="#EEF2F7" stroke="#1B2A4A" stroke-width="3" /><text x="600" y="72" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1B2A4A">SOCIAL STRUCTURE</text><text x="600" y="110" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="500" fill="#25313D">All social interaction takes place within a social structure</text><rect x="55" y="145" width="204" height="365" rx="22" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="55" y="145" width="204" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><circle cx="157.0" cy="202" r="26" fill="#1B2A4A" stroke="none" stroke-width="2"/><text x="157.0" y="211" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">1</text><text x="157.0" y="282" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1B2A4A"><tspan x="157.0" dy="0">Statuses</tspan></text><line x1="85" y1="322" x2="229" y2="322" stroke="#DDE3EA" stroke-width="2" stroke-linecap="round"/><text x="157.0" y="362" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" fill="#25313D"><tspan x="157.0" dy="0">any socially</tspan><tspan x="157.0" dy="27">defined position</tspan><tspan x="157.0" dy="27">within a group</tspan><tspan x="157.0" dy="27">or society</tspan></text><rect x="277" y="145" width="204" height="365" rx="22" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="277" y="145" width="204" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><circle cx="379.0" cy="202" r="26" fill="#1B2A4A" stroke="none" stroke-width="2"/><text x="379.0" y="211" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">2</text><text x="379.0" y="282" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1B2A4A"><tspan x="379.0" dy="0">Social roles</tspan></text><line x1="307" y1="322" x2="451" y2="322" stroke="#DDE3EA" stroke-width="2" stroke-linecap="round"/><text x="379.0" y="362" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" fill="#25313D"><tspan x="379.0" dy="0">a set of</tspan><tspan x="379.0" dy="27">expectations for</tspan><tspan x="379.0" dy="27">people who occupy</tspan><tspan x="379.0" dy="27">a given status</tspan></text><rect x="499" y="145" width="204" height="365" rx="22" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="499" y="145" width="204" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><circle cx="601.0" cy="202" r="26" fill="#1B2A4A" stroke="none" stroke-width="2"/><text x="601.0" y="211" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">3</text><text x="601.0" y="282" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1B2A4A"><tspan x="601.0" dy="0">Groups</tspan></text><line x1="529" y1="322" x2="673" y2="322" stroke="#DDE3EA" stroke-width="2" stroke-linecap="round"/><text x="601.0" y="362" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" fill="#25313D"><tspan x="601.0" dy="0">people with</tspan><tspan x="601.0" dy="27">similar norms,</tspan><tspan x="601.0" dy="27">values, and</tspan><tspan x="601.0" dy="27">expectations who</tspan><tspan x="601.0" dy="27">interact regularly</tspan></text><rect x="721" y="145" width="204" height="365" rx="22" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="721" y="145" width="204" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><circle cx="823.0" cy="202" r="26" fill="#1B2A4A" stroke="none" stroke-width="2"/><text x="823.0" y="211" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">4</text><text x="823.0" y="268" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1B2A4A"><tspan x="823.0" dy="0">Social</tspan><tspan x="823.0" dy="28">networks</tspan></text><line x1="751" y1="322" x2="895" y2="322" stroke="#DDE3EA" stroke-width="2" stroke-linecap="round"/><text x="823.0" y="362" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" fill="#25313D"><tspan x="823.0" dy="0">relationships</tspan><tspan x="823.0" dy="27">linking a person</tspan><tspan x="823.0" dy="27">directly to others</tspan><tspan x="823.0" dy="27">and indirectly to</tspan><tspan x="823.0" dy="27">still more people</tspan></text><rect x="943" y="145" width="204" height="365" rx="22" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="943" y="145" width="204" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><circle cx="1045.0" cy="202" r="26" fill="#1B2A4A" stroke="none" stroke-width="2"/><text x="1045.0" y="211" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#FFFFFF">5</text><text x="1045.0" y="268" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1B2A4A"><tspan x="1045.0" dy="0">Social</tspan><tspan x="1045.0" dy="28">institutions</tspan></text><line x1="973" y1="322" x2="1117" y2="322" stroke="#DDE3EA" stroke-width="2" stroke-linecap="round"/><text x="1045.0" y="362" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" fill="#25313D"><tspan x="1045.0" dy="0">organized patterns</tspan><tspan x="1045.0" dy="27">of beliefs and</tspan><tspan x="1045.0" dy="27">behavior centered</tspan><tspan x="1045.0" dy="27">on basic</tspan><tspan x="1045.0" dy="27">social needs</tspan></text>
</svg>
