<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Durkheim, Tönnies, and Lenski compared</title>
  <desc id="desc">Durkheim emphasizes the division of labor, Tönnies self-interest versus the group, and Lenski the level of technology; only Lenski's types do not coexist in one society.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="620" fill="#FCFCFA"/>
  <text x="600" y="56" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1B2A4A">DURKHEIM, TÖNNIES, AND LENSKI: THREE WAYS TO COMPARE SOCIETIES</text><rect x="60" y="110" width="330" height="380" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="60" y="110" width="330" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><text x="225.0" y="168" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1B2A4A">Durkheim</text><text x="225.0" y="215" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#25313D"><tspan x="225.0" dy="0">Emphasis: the division of labor</tspan><tspan x="225.0" dy="29"> </tspan><tspan x="225.0" dy="29">Mechanical → organic</tspan><tspan x="225.0" dy="29">solidarity</tspan><tspan x="225.0" dy="29"> </tspan><tspan x="225.0" dy="29">Both types can coexist</tspan><tspan x="225.0" dy="29">in one society</tspan></text><rect x="435" y="110" width="330" height="380" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="435" y="110" width="330" height="10" rx="5" fill="#A47712" stroke="none" stroke-width="0" /><text x="600.0" y="168" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1B2A4A">Tönnies</text><text x="600.0" y="215" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#25313D"><tspan x="600.0" dy="0">Emphasis: self-interest vs.</tspan><tspan x="600.0" dy="29">the well-being of the group</tspan><tspan x="600.0" dy="29">Gemeinschaft → Gesellschaft</tspan><tspan x="600.0" dy="29"> </tspan><tspan x="600.0" dy="29"> </tspan><tspan x="600.0" dy="29">Both types can coexist</tspan><tspan x="600.0" dy="29">in one society</tspan></text><rect x="810" y="110" width="330" height="380" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="810" y="110" width="330" height="10" rx="5" fill="#C65D4B" stroke="none" stroke-width="0" /><text x="975.0" y="168" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1B2A4A">Lenski</text><text x="975.0" y="215" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#25313D"><tspan x="975.0" dy="0">Emphasis: level of technology</tspan><tspan x="975.0" dy="29"> </tspan><tspan x="975.0" dy="29">Hunting-and-gathering →</tspan><tspan x="975.0" dy="29">… → postmodern</tspan><tspan x="975.0" dy="29"> </tspan><tspan x="975.0" dy="29">Historical sequence; types</tspan><tspan x="975.0" dy="29">do not coexist</tspan></text><rect x="50.0" y="530" width="1100" height="58" rx="18" fill="#EEF2F7" stroke="#1B2A4A" stroke-width="2" /><text x="600" y="569" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#1B2A4A">Macro: structure grows more complex and new institutions take over family functions. Micro: more roles, more networks, less kinship.</text>
</svg>
