<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">Durkheim's mechanical and organic solidarity</title>
  <desc id="desc">Mechanical solidarity rests on sameness in societies with minimal division of labor; organic solidarity rests on interdependence in societies with complex division of labor.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="#FCFCFA"/>
  <text x="600" y="56" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B2A4A">DURKHEIM: WHAT HOLDS A SOCIETY TOGETHER DEPENDS ON ITS DIVISION OF LABOR</text><rect x="60" y="100" width="500" height="380" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="60" y="100" width="500" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><text x="310.0" y="158" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#1B2A4A">Mechanical solidarity</text><text x="310.0" y="205" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#25313D"><tspan x="310.0" dy="0">Minimal division of labor</tspan><tspan x="310.0" dy="30">Everyone performs the same tasks</tspan><tspan x="310.0" dy="30">No one asks “what do your parents do?”</tspan><tspan x="310.0" dy="30">The group dominates; few social roles</tspan><tspan x="310.0" dy="30">Face-to-face, intimate contact</tspan><tspan x="310.0" dy="30"> </tspan><tspan x="310.0" dy="30">Alike, like identical parts</tspan></text><rect x="640" y="100" width="500" height="380" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="640" y="100" width="500" height="10" rx="5" fill="#A47712" stroke="none" stroke-width="0" /><text x="890.0" y="158" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#1B2A4A">Organic solidarity</text><text x="890.0" y="205" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#25313D"><tspan x="890.0" dy="0">Complex division of labor</tspan><tspan x="890.0" dy="30">Hundreds of people behind one food item</tspan><tspan x="890.0" dy="30">No individual can go it alone</tspan><tspan x="890.0" dy="30">Dependence on others is essential</tspan><tspan x="890.0" dy="30">Many specialized roles</tspan><tspan x="890.0" dy="30"> </tspan><tspan x="890.0" dy="30">Interdependent, like organs of a body</tspan></text><circle cx="190" cy="455" r="12" fill="#147D79" stroke="none" stroke-width="2"/><circle cx="234" cy="455" r="12" fill="#147D79" stroke="none" stroke-width="2"/><circle cx="278" cy="455" r="12" fill="#147D79" stroke="none" stroke-width="2"/><circle cx="322" cy="455" r="12" fill="#147D79" stroke="none" stroke-width="2"/><circle cx="366" cy="455" r="12" fill="#147D79" stroke="none" stroke-width="2"/><circle cx="410" cy="455" r="12" fill="#147D79" stroke="none" stroke-width="2"/><circle cx="830" cy="455" r="12" fill="#A47712" stroke="none" stroke-width="2"/><rect x="862" y="443" width="24" height="24" rx="4" fill="#A47712" stroke="none" stroke-width="0" /><path d="M 920 443 L 934 467 L 906 467 Z" fill="#A47712" stroke="#A47712" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><circle cx="970" cy="455" r="12" fill="#C65D4B" stroke="none" stroke-width="2"/><rect x="1002" y="443" width="24" height="24" rx="4" fill="#1B2A4A" stroke="none" stroke-width="0" /><path d="M 1060 443 L 1074 467 L 1046 467 Z" fill="#147D79" stroke="#147D79" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><line x1="560" y1="290" x2="640" y2="290" stroke="#1B2A4A" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><text x="600" y="270" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#6F7985">technology</text><text x="600" y="325" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#6F7985">advances</text><text x="600" y="545" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#6F7985">The Division of Labor in Society ([1893] 1933)</text>
</svg>
