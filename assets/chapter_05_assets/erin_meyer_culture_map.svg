<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="665" viewBox="0 0 1200 665" role="img" aria-labelledby="title desc">
  <title id="title">Erin Meyer's eight Culture Map scales</title>
  <desc id="desc">Eight continua compare communication, evaluation, persuasion, leadership, decision making, trust, disagreement, and scheduling across cultures.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="665" fill="#FCFCFA"/>
  <rect x="45.0" y="8" width="1110" height="58" rx="18" fill="#EEF2F7" stroke="#1B2A4A" stroke-width="2" /><text x="600" y="47" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1B2A4A">Cultural expectations shape how organizations communicate, decide, trust, and coordinate.</text><rect x="35" y="84" width="550" height="108" rx="20" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><text x="310.0" y="107" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#147D79">Communicating</text><text x="310.0" y="128" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#6F7985">How much meaning is stated directly?</text><line x1="123" y1="149" x2="497" y2="149" stroke="#147D79" stroke-width="4" stroke-linecap="round"/><circle cx="123" cy="149" r="7" fill="#147D79" stroke="none" stroke-width="2"/><circle cx="497" cy="149" r="7" fill="#147D79" stroke="none" stroke-width="2"/><text x="55" y="180" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#25313D">Low-context</text><text x="565" y="180" text-anchor="end" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#25313D">High-context</text><rect x="35" y="210" width="550" height="108" rx="20" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><text x="310.0" y="233" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#A47712">Evaluating</text><text x="310.0" y="254" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#6F7985">How is criticism delivered?</text><line x1="123" y1="275" x2="497" y2="275" stroke="#A47712" stroke-width="4" stroke-linecap="round"/><circle cx="123" cy="275" r="7" fill="#A47712" stroke="none" stroke-width="2"/><circle cx="497" cy="275" r="7" fill="#A47712" stroke="none" stroke-width="2"/><text x="55" y="306" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#25313D">Direct negative feedback</text><text x="565" y="306" text-anchor="end" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#25313D">Indirect negative feedback</text><rect x="35" y="336" width="550" height="108" rx="20" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><text x="310.0" y="359" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#C65D4B">Persuading</text><text x="310.0" y="380" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#6F7985">Do arguments begin with theory or examples?</text><line x1="123" y1="401" x2="497" y2="401" stroke="#C65D4B" stroke-width="4" stroke-linecap="round"/><circle cx="123" cy="401" r="7" fill="#C65D4B" stroke="none" stroke-width="2"/><circle cx="497" cy="401" r="7" fill="#C65D4B" stroke="none" stroke-width="2"/><text x="55" y="432" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#25313D">Principles-first</text><text x="565" y="432" text-anchor="end" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#25313D">Applications-first</text><rect x="35" y="462" width="550" height="108" rx="20" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><text x="310.0" y="485" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1B2A4A">Leading</text><text x="310.0" y="506" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#6F7985">How much distance separates leaders and staff?</text><line x1="123" y1="527" x2="497" y2="527" stroke="#1B2A4A" stroke-width="4" stroke-linecap="round"/><circle cx="123" cy="527" r="7" fill="#1B2A4A" stroke="none" stroke-width="2"/><circle cx="497" cy="527" r="7" fill="#1B2A4A" stroke="none" stroke-width="2"/><text x="55" y="558" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#25313D">Egalitarian</text><text x="565" y="558" text-anchor="end" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#25313D">Hierarchical</text><rect x="615" y="84" width="550" height="108" rx="20" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><text x="890.0" y="107" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#147D79">Deciding</text><text x="890.0" y="128" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#6F7985">Who contributes to the final decision?</text><line x1="703" y1="149" x2="1077" y2="149" stroke="#147D79" stroke-width="4" stroke-linecap="round"/><circle cx="703" cy="149" r="7" fill="#147D79" stroke="none" stroke-width="2"/><circle cx="1077" cy="149" r="7" fill="#147D79" stroke="none" stroke-width="2"/><text x="635" y="180" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#25313D">Consensual</text><text x="1145" y="180" text-anchor="end" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#25313D">Top-down</text><rect x="615" y="210" width="550" height="108" rx="20" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><text x="890.0" y="233" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#A47712">Trusting</text><text x="890.0" y="254" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#6F7985">Is trust built through work or relationships?</text><line x1="703" y1="275" x2="1077" y2="275" stroke="#A47712" stroke-width="4" stroke-linecap="round"/><circle cx="703" cy="275" r="7" fill="#A47712" stroke="none" stroke-width="2"/><circle cx="1077" cy="275" r="7" fill="#A47712" stroke="none" stroke-width="2"/><text x="635" y="306" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#25313D">Task-based</text><text x="1145" y="306" text-anchor="end" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#25313D">Relationship-based</text><rect x="615" y="336" width="550" height="108" rx="20" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><text x="890.0" y="359" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#C65D4B">Disagreeing</text><text x="890.0" y="380" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#6F7985">Is open disagreement acceptable?</text><line x1="703" y1="401" x2="1077" y2="401" stroke="#C65D4B" stroke-width="4" stroke-linecap="round"/><circle cx="703" cy="401" r="7" fill="#C65D4B" stroke="none" stroke-width="2"/><circle cx="1077" cy="401" r="7" fill="#C65D4B" stroke="none" stroke-width="2"/><text x="635" y="432" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#25313D">Confrontational</text><text x="1145" y="432" text-anchor="end" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#25313D">Avoids confrontation</text><rect x="615" y="462" width="550" height="108" rx="20" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><text x="890.0" y="485" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1B2A4A">Scheduling</text><text x="890.0" y="506" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="500" fill="#6F7985">How fixed are plans and deadlines?</text><line x1="703" y1="527" x2="1077" y2="527" stroke="#1B2A4A" stroke-width="4" stroke-linecap="round"/><circle cx="703" cy="527" r="7" fill="#1B2A4A" stroke="none" stroke-width="2"/><circle cx="1077" cy="527" r="7" fill="#1B2A4A" stroke="none" stroke-width="2"/><text x="635" y="558" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#25313D">Linear-time</text><text x="1145" y="558" text-anchor="end" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#25313D">Flexible-time</text><rect x="150.0" y="598" width="900" height="58" rx="18" fill="#FFF7E3" stroke="#A47712" stroke-width="2" /><text x="600" y="637" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#1B2A4A">Relative tendencies, not fixed descriptions of every individual.</text>
</svg>
