<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Figure 5-4: labor union membership worldwide</title>
  <desc id="desc">Iceland 90 percent, Belgium 54, Italy 34, Canada 28, Japan 17, Mexico 13, United States 10, France 8.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
