<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">Weber's five characteristics of bureaucracy</title>
  <desc id="desc">Division of labor, hierarchy of authority, written rules and regulations, impersonality, and employment based on technical qualifications, each with a dysfunction.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="#FCFCFA"/>
  <text x="600" y="56" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#1B2A4A">WEBER’S IDEAL TYPE OF BUREAUCRACY: FIVE CHARACTERISTICS</text><rect x="60" y="110" width="200" height="260" rx="20" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="60" y="110" width="200" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><text x="160" y="170" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#147D79"><tspan x="160" dy="0">Division</tspan><tspan x="160" dy="26">of labor</tspan></text><text x="160" y="250" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#25313D"><tspan x="160" dy="0">Specialized experts</tspan><tspan x="160" dy="24">perform specific tasks</tspan></text><rect x="280" y="110" width="200" height="260" rx="20" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="280" y="110" width="200" height="10" rx="5" fill="#A47712" stroke="none" stroke-width="0" /><text x="380" y="170" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#A47712"><tspan x="380" dy="0">Hierarchy</tspan><tspan x="380" dy="26">of authority</tspan></text><text x="380" y="250" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#25313D"><tspan x="380" dy="0">Each position is under</tspan><tspan x="380" dy="24">a higher authority</tspan></text><rect x="500" y="110" width="200" height="260" rx="20" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="500" y="110" width="200" height="10" rx="5" fill="#C65D4B" stroke="none" stroke-width="0" /><text x="600" y="170" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#C65D4B"><tspan x="600" dy="0">Written rules</tspan></text><text x="600" y="250" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#25313D"><tspan x="600" dy="0">Clear standards and</tspan><tspan x="600" dy="24">continuity over time</tspan></text><rect x="720" y="110" width="200" height="260" rx="20" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="720" y="110" width="200" height="10" rx="5" fill="#1B2A4A" stroke="none" stroke-width="0" /><text x="820" y="170" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1B2A4A"><tspan x="820" dy="0">Impersonality</tspan></text><text x="820" y="250" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#25313D"><tspan x="820" dy="0">Work done “without</tspan><tspan x="820" dy="24">hatred or passion”</tspan></text><rect x="940" y="110" width="200" height="260" rx="20" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="940" y="110" width="200" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><text x="1040" y="170" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#147D79"><tspan x="1040" dy="0">Technical</tspan><tspan x="1040" dy="26">qualifications</tspan></text><text x="1040" y="250" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#25313D"><tspan x="1040" dy="0">Hiring and promotion</tspan><tspan x="1040" dy="24">on merit, not favoritism</tspan></text><rect x="60" y="400" width="1080" height="150" rx="18" fill="#EEF2F7" stroke="#1B2A4A" stroke-width="2" /><text x="600" y="440" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B2A4A">Each one has a dysfunction</text><text x="600" y="475" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#25313D"><tspan x="600" dy="0">trained incapacity and alienation · no voice in decisions · goal displacement · cold, uncaring treatment · the Peter principle</tspan><tspan x="600" dy="28">An ideal type is a model for evaluating cases. No real organization matches it exactly (Weber [1913–1922] 1947).</tspan></text>
</svg>
