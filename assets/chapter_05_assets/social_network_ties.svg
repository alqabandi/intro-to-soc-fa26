<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">A social network of direct and indirect ties</title>
  <desc id="desc">A person at the center links directly to family, classmates, a diwaniya, and colleagues, and through them indirectly to further people.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#FCFCFA"/>
  <text x="600" y="56" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B2A4A">A SOCIAL NETWORK LINKS YOU DIRECTLY TO SOME PEOPLE AND INDIRECTLY TO MANY MORE</text><line x1="600" y1="330" x2="400" y2="200" stroke="#1B2A4A" stroke-width="5" stroke-linecap="round"/><line x1="600" y1="330" x2="430" y2="460" stroke="#1B2A4A" stroke-width="5" stroke-linecap="round"/><line x1="600" y1="330" x2="770" y2="200" stroke="#1B2A4A" stroke-width="5" stroke-linecap="round"/><line x1="600" y1="330" x2="790" y2="460" stroke="#1B2A4A" stroke-width="5" stroke-linecap="round"/><line x1="400" y1="200" x2="230" y2="130" stroke="#6F7985" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8"/><line x1="400" y1="200" x2="250" y2="260" stroke="#6F7985" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8"/><line x1="430" y1="460" x2="260" y2="540" stroke="#6F7985" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8"/><line x1="430" y1="460" x2="330" y2="590" stroke="#6F7985" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8"/><line x1="770" y1="200" x2="930" y2="130" stroke="#6F7985" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8"/><line x1="770" y1="200" x2="960" y2="250" stroke="#6F7985" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8"/><line x1="790" y1="460" x2="940" y2="540" stroke="#6F7985" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8"/><line x1="790" y1="460" x2="1010" y2="420" stroke="#6F7985" stroke-width="3" stroke-linecap="round" stroke-dasharray="10 8"/><circle cx="230" cy="130" r="16" fill="#EEF2F7" stroke="#6F7985" stroke-width="3"/><circle cx="250" cy="260" r="16" fill="#EEF2F7" stroke="#6F7985" stroke-width="3"/><circle cx="260" cy="540" r="16" fill="#EEF2F7" stroke="#6F7985" stroke-width="3"/><circle cx="330" cy="590" r="16" fill="#EEF2F7" stroke="#6F7985" stroke-width="3"/><circle cx="930" cy="130" r="16" fill="#EEF2F7" stroke="#6F7985" stroke-width="3"/><circle cx="960" cy="250" r="16" fill="#EEF2F7" stroke="#6F7985" stroke-width="3"/><circle cx="940" cy="540" r="16" fill="#EEF2F7" stroke="#6F7985" stroke-width="3"/><circle cx="1010" cy="420" r="16" fill="#EEF2F7" stroke="#6F7985" stroke-width="3"/><circle cx="400" cy="200" r="30" fill="#EAF6F5" stroke="#147D79" stroke-width="5"/><text x="400" y="158" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#1B2A4A">family</text><circle cx="430" cy="460" r="30" fill="#EAF6F5" stroke="#147D79" stroke-width="5"/><text x="430" y="515" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#1B2A4A">classmates</text><circle cx="770" cy="200" r="30" fill="#EAF6F5" stroke="#147D79" stroke-width="5"/><text x="770" y="158" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#1B2A4A">diwaniya</text><circle cx="790" cy="460" r="30" fill="#EAF6F5" stroke="#147D79" stroke-width="5"/><text x="790" y="515" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#1B2A4A">colleagues</text><circle cx="600" cy="330" r="44" fill="#A47712" stroke="#1B2A4A" stroke-width="5"/><text x="600" y="338" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">you</text><rect x="60" y="600" width="1080" height="40" rx="12" fill="#FFF7E3" stroke="#A47712" stroke-width="2" /><text x="600" y="627" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#1B2A4A">Weak and distant contacts can be the ones that carry job information: Einstein found work through a classmate’s father</text>
</svg>
