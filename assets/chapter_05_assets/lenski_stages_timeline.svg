<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Lenski's stages of sociocultural evolution</title>
  <desc id="desc">Hunting-and-gathering, horticultural, agrarian, industrial, postindustrial, and postmodern societies on a timeline.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#FCFCFA"/>
  <text x="600" y="56" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B2A4A">LENSKI: SOCIETIES CHANGE AS THEIR TECHNOLOGY CHANGES</text><line x1="80" y1="300" x2="1120" y2="300" stroke="#1B2A4A" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="150" cy="300" r="18" fill="#147D79" stroke="#FFFFFF" stroke-width="4"/><line x1="150" y1="300" x2="150" y2="220" stroke="#147D79" stroke-width="3" stroke-linecap="round"/><text x="150" y="150" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#147D79">Hunting-and-gathering</text><text x="150" y="176" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#6F7985">beginning of human life</text><text x="150" y="202" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#25313D"><tspan x="150" dy="0">nomadic; whatever food</tspan><tspan x="150" dy="19">and fibers are available</tspan></text><circle cx="330" cy="300" r="18" fill="#147D79" stroke="#FFFFFF" stroke-width="4"/><line x1="330" y1="300" x2="330" y2="360" stroke="#147D79" stroke-width="3" stroke-linecap="round"/><text x="330" y="380" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#147D79">Horticultural</text><text x="330" y="406" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#6F7985">about 12,000 years ago</text><text x="330" y="432" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#25313D"><tspan x="330" dy="0">planting seeds; digging</tspan><tspan x="330" dy="19">sticks and hoes</tspan></text><circle cx="510" cy="300" r="18" fill="#147D79" stroke="#FFFFFF" stroke-width="4"/><line x1="510" y1="300" x2="510" y2="220" stroke="#147D79" stroke-width="3" stroke-linecap="round"/><text x="510" y="150" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#147D79">Agrarian</text><text x="510" y="176" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#6F7985">about 5,000 years ago</text><text x="510" y="202" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#25313D"><tspan x="510" dy="0">the plow; larger, stable</tspan><tspan x="510" dy="19">settlements</tspan></text><circle cx="690" cy="300" r="18" fill="#A47712" stroke="#FFFFFF" stroke-width="4"/><line x1="690" y1="300" x2="690" y2="360" stroke="#A47712" stroke-width="3" stroke-linecap="round"/><text x="690" y="380" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#A47712">Industrial</text><text x="690" y="406" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#6F7985">1760–1850</text><text x="690" y="432" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#25313D"><tspan x="690" dy="0">mechanical power; factories;</tspan><tspan x="690" dy="19">central workplaces</tspan></text><circle cx="870" cy="300" r="18" fill="#C65D4B" stroke="#FFFFFF" stroke-width="4"/><line x1="870" y1="300" x2="870" y2="220" stroke="#C65D4B" stroke-width="3" stroke-linecap="round"/><text x="870" y="150" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#C65D4B">Postindustrial</text><text x="870" y="176" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#6F7985">1960s</text><text x="870" y="202" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#25313D"><tspan x="870" dy="0">services; processing and</tspan><tspan x="870" dy="19">control of information</tspan></text><circle cx="1050" cy="300" r="18" fill="#1B2A4A" stroke="#FFFFFF" stroke-width="4"/><line x1="1050" y1="300" x2="1050" y2="360" stroke="#1B2A4A" stroke-width="3" stroke-linecap="round"/><text x="1050" y="380" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1B2A4A">Postmodern</text><text x="1050" y="406" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#6F7985">latter 1970s</text><text x="1050" y="432" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="500" fill="#25313D"><tspan x="1050" dy="0">consumer goods and</tspan><tspan x="1050" dy="19">media images; global</tspan></text><rect x="130" y="500" width="940" height="60" rx="16" fill="#EEF2F7" stroke="#1B2A4A" stroke-width="2" /><text x="600" y="538" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1B2A4A">Preindustrial (three types) → Industrial → Postindustrial → Postmodern</text><text x="600" y="605" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#6F7985">Sociocultural evolution: long-term social trends resulting from the interplay of continuity, innovation, and selection (Nolan and Lenski 2015)</text>
</svg>
