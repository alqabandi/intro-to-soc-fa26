<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Four classifications of groups</title>
  <desc id="desc">Primary and secondary groups by closeness, in-groups and out-groups by belonging, reference groups by comparison, and coalitions by shared goal.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#FCFCFA"/>
  <text x="600" y="56" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B2A4A">FOUR WAYS SOCIOLOGISTS CLASSIFY GROUPS</text><rect x="60" y="100" width="520" height="215" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="60" y="100" width="520" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><text x="320.0" y="158" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B2A4A">Primary / secondary</text><text x="320.0" y="205" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#25313D"><tspan x="320.0" dy="0">By closeness (Cooley)</tspan><tspan x="320.0" dy="28">Family, close friends vs.</tspan><tspan x="320.0" dy="28">a 300-student lecture</tspan></text><rect x="620" y="100" width="520" height="215" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="620" y="100" width="520" height="10" rx="5" fill="#C65D4B" stroke="none" stroke-width="0" /><text x="880.0" y="158" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B2A4A">In-group / out-group</text><text x="880.0" y="205" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#25313D"><tspan x="880.0" dy="0">By belonging (Sumner)</tspan><tspan x="880.0" dy="28">“we” and “us” vs.</tspan><tspan x="880.0" dy="28">“they” and “them”</tspan></text><rect x="60" y="340" width="520" height="215" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="60" y="340" width="520" height="10" rx="5" fill="#A47712" stroke="none" stroke-width="0" /><text x="320.0" y="398" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B2A4A">Reference group</text><text x="320.0" y="445" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#25313D"><tspan x="320.0" dy="0">By comparison (Merton)</tspan><tspan x="320.0" dy="28">The standard you measure</tspan><tspan x="320.0" dy="28">yourself against</tspan></text><rect x="620" y="340" width="520" height="215" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="620" y="340" width="520" height="10" rx="5" fill="#1B2A4A" stroke="none" stroke-width="0" /><text x="880.0" y="398" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B2A4A">Coalition</text><text x="880.0" y="445" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#25313D"><tspan x="880.0" dy="0">By shared goal</tspan><tspan x="880.0" dy="28">A temporary or permanent</tspan><tspan x="880.0" dy="28">alliance</tspan></text><text x="600" y="615" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#6F7985">A group: any number of people with similar norms, values, and expectations who interact with one another on a regular basis</text>
</svg>
