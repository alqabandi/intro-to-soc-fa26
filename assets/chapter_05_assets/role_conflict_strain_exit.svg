<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Role conflict, role strain, and role exit</title>
  <desc id="desc">Role conflict arises between two statuses, role strain within one status, and role exit is the process of leaving a role central to one's identity.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#FCFCFA"/>
  <text x="600" y="56" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B2A4A">THREE WAYS ROLES BECOME DIFFICULT</text><rect x="60" y="110" width="330" height="370" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="60" y="110" width="330" height="10" rx="5" fill="#C65D4B" stroke="none" stroke-width="0" /><text x="225.0" y="168" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1B2A4A">Role conflict</text><text x="225.0" y="215" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="500" fill="#25313D"><tspan x="225.0" dy="0">Two or more statuses,</tspan><tspan x="225.0" dy="30">incompatible expectations</tspan><tspan x="225.0" dy="30"> </tspan><tspan x="225.0" dy="30">Supervisor and friend</tspan><tspan x="225.0" dy="30">of the people she now</tspan><tspan x="225.0" dy="30">must evaluate</tspan></text><rect x="435" y="110" width="330" height="370" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="435" y="110" width="330" height="10" rx="5" fill="#A47712" stroke="none" stroke-width="0" /><text x="600.0" y="168" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1B2A4A">Role strain</text><text x="600.0" y="215" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="500" fill="#25313D"><tspan x="600.0" dy="0">One status,</tspan><tspan x="600.0" dy="30">conflicting demands</tspan><tspan x="600.0" dy="30"> </tspan><tspan x="600.0" dy="30">Navajo officer expected</tspan><tspan x="600.0" dy="30">to make arrests and</tspan><tspan x="600.0" dy="30">to practise Peacemaking</tspan></text><rect x="810" y="110" width="330" height="370" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="810" y="110" width="330" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><text x="975.0" y="168" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1B2A4A">Role exit</text><text x="975.0" y="215" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="500" fill="#25313D"><tspan x="975.0" dy="0">Leaving a role central</tspan><tspan x="975.0" dy="30">to one’s identity</tspan><tspan x="975.0" dy="30"> </tspan><tspan x="975.0" dy="30">Ex-nuns, retirees,</tspan><tspan x="975.0" dy="30">divorced people,</tspan><tspan x="975.0" dy="30">former doctors (Ebaugh)</tspan></text><circle cx="170" cy="523.3" r="9.1" fill="#C65D4B" stroke="none" stroke-width="2"/><path d="M 170 535.2 L 170 561.8 M 153.2 546.4 L 170 539.4 L 186.8 546.4 M 170 561.8 L 156.0 582.8 M 170 561.8 L 184.0 582.8" fill="none" stroke="#C65D4B" stroke-width="4.8999999999999995" stroke-linecap="round" stroke-linejoin="round" /><circle cx="280" cy="523.3" r="9.1" fill="#C65D4B" stroke="none" stroke-width="2"/><path d="M 280 535.2 L 280 561.8 M 263.2 546.4 L 280 539.4 L 296.8 546.4 M 280 561.8 L 266.0 582.8 M 280 561.8 L 294.0 582.8" fill="none" stroke="#C65D4B" stroke-width="4.8999999999999995" stroke-linecap="round" stroke-linejoin="round" /><text x="225" y="600" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#6F7985">2 statuses → 1 person</text><circle cx="600" cy="523.3" r="9.1" fill="#A47712" stroke="none" stroke-width="2"/><path d="M 600 535.2 L 600 561.8 M 583.2 546.4 L 600 539.4 L 616.8 546.4 M 600 561.8 L 586.0 582.8 M 600 561.8 L 614.0 582.8" fill="none" stroke="#A47712" stroke-width="4.8999999999999995" stroke-linecap="round" stroke-linejoin="round" /><text x="600" y="600" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#6F7985">1 status → opposing demands</text><circle cx="930" cy="523.3" r="9.1" fill="#147D79" stroke="none" stroke-width="2"/><path d="M 930 535.2 L 930 561.8 M 913.2 546.4 L 930 539.4 L 946.8 546.4 M 930 561.8 L 916.0 582.8 M 930 561.8 L 944.0 582.8" fill="none" stroke="#147D79" stroke-width="4.8999999999999995" stroke-linecap="round" stroke-linejoin="round" /><line x1="965" y1="540" x2="1030" y2="540" stroke="#147D79" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="975" y="600" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#6F7985">old role → new identity</text>
</svg>
