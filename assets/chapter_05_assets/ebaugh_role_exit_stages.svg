<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Ebaugh's four stages of role exit</title>
  <desc id="desc">Four numbered stages joined by arrows: 1 doubt, 2 search for alternatives, 3 action or departure, 4 creation of a new identity, each with a short description.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="380" fill="#FCFCFA"/>
  <rect x="10" y="20" width="250" height="340" rx="22" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="10" y="20" width="250" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><circle cx="135.0" cy="78" r="27" fill="#1B2A4A" stroke="none" stroke-width="2"/><text x="135.0" y="88" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">1</text><text x="135.0" y="150" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#1B2A4A"><tspan x="135.0" dy="0">Doubt</tspan></text><line x1="40" y1="196" x2="230" y2="196" stroke="#DDE3EA" stroke-width="2" stroke-linecap="round"/><text x="135.0" y="238" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#25313D"><tspan x="135.0" dy="0">frustration, burnout,</tspan><tspan x="135.0" dy="28">or unhappiness with</tspan><tspan x="135.0" dy="28">an accustomed status</tspan></text><path d="M 278 170 L 304 190 L 278 210 Z" fill="#1B2A4A" stroke="#1B2A4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="320" y="20" width="250" height="340" rx="22" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="320" y="20" width="250" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><circle cx="445.0" cy="78" r="27" fill="#1B2A4A" stroke="none" stroke-width="2"/><text x="445.0" y="88" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">2</text><text x="445.0" y="136" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#1B2A4A"><tspan x="445.0" dy="0">Search for</tspan><tspan x="445.0" dy="30">alternatives</tspan></text><line x1="350" y1="196" x2="540" y2="196" stroke="#DDE3EA" stroke-width="2" stroke-linecap="round"/><text x="445.0" y="238" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#25313D"><tspan x="445.0" dy="0">trying life outside</tspan><tspan x="445.0" dy="28">the role, such as a</tspan><tspan x="445.0" dy="28">leave of absence</tspan><tspan x="445.0" dy="28">from a career</tspan></text><path d="M 588 170 L 614 190 L 588 210 Z" fill="#1B2A4A" stroke="#1B2A4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="630" y="20" width="250" height="340" rx="22" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="630" y="20" width="250" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><circle cx="755.0" cy="78" r="27" fill="#1B2A4A" stroke="none" stroke-width="2"/><text x="755.0" y="88" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">3</text><text x="755.0" y="136" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#1B2A4A"><tspan x="755.0" dy="0">Action or</tspan><tspan x="755.0" dy="30">departure</tspan></text><line x1="660" y1="196" x2="850" y2="196" stroke="#DDE3EA" stroke-width="2" stroke-linecap="round"/><text x="755.0" y="238" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#25313D"><tspan x="755.0" dy="0">most can name a</tspan><tspan x="755.0" dy="28">clear turning point;</tspan><tspan x="755.0" dy="28">20% describe a</tspan><tspan x="755.0" dy="28">gradual process</tspan></text><path d="M 898 170 L 924 190 L 898 210 Z" fill="#1B2A4A" stroke="#1B2A4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /><rect x="940" y="20" width="250" height="340" rx="22" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="940" y="20" width="250" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><circle cx="1065.0" cy="78" r="27" fill="#1B2A4A" stroke="none" stroke-width="2"/><text x="1065.0" y="88" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">4</text><text x="1065.0" y="136" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#1B2A4A"><tspan x="1065.0" dy="0">Creation of a</tspan><tspan x="1065.0" dy="30">new identity</tspan></text><line x1="970" y1="196" x2="1160" y2="196" stroke="#DDE3EA" stroke-width="2" stroke-linecap="round"/><text x="1065.0" y="238" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#25313D"><tspan x="1065.0" dy="0">establishing a</tspan><tspan x="1065.0" dy="28">new role and</tspan><tspan x="1065.0" dy="28">identity</tspan></text>
</svg>
