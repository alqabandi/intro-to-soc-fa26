<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Zimbardo's mock prison: two roles assigned by chance</title>
  <desc id="desc">Eleven guards gained power and ten prisoners lost liberty; assignment was random, so there were no measurable differences at the start. The two-week study closed after six days.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#FCFCFA"/>
  <text x="600" y="58" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B2A4A">ONE COIN FLIP, TWO SOCIAL POSITIONS</text><rect x="60" y="110" width="400" height="330" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="60" y="110" width="400" height="10" rx="5" fill="#C65D4B" stroke="none" stroke-width="0" /><text x="260.0" y="168" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#1B2A4A">“Guards” (11)</text><text x="260.0" y="215" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="500" fill="#25313D"><tspan x="260.0" dy="0">Gained social power by</tspan><tspan x="260.0" dy="29">controlling the prisoners</tspan><tspan x="260.0" dy="29">Reflective sunglasses:</tspan><tspan x="260.0" dy="29">no eye contact</tspan><tspan x="260.0" dy="29">Addressed prisoners by number</tspan><tspan x="260.0" dy="29">Some became cruel; others did not</tspan></text><rect x="740" y="110" width="400" height="330" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="740" y="110" width="400" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><text x="940.0" y="168" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#1B2A4A">“Prisoners” (10)</text><text x="940.0" y="215" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="500" fill="#25313D"><tspan x="940.0" dy="0">Lost liberty, civil rights,</tspan><tspan x="940.0" dy="29">independence, and privacy</tspan><tspan x="940.0" dy="29">Stripped, searched, deloused,</tspan><tspan x="940.0" dy="29">issued a uniform and a number</tspan><tspan x="940.0" dy="29">Became servile and dehumanized,</tspan><tspan x="940.0" dy="29">thinking only of escape</tspan></text><rect x="480" y="170" width="240" height="210" rx="26" fill="#EEF2F7" stroke="#1B2A4A" stroke-width="3" stroke-dasharray="12 10"/><text x="600" y="225" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B2A4A">Random</text><text x="600" y="258" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B2A4A">assignment</text><text x="600" y="300" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" fill="#25313D"><tspan x="600" dy="0">No measurable</tspan><tspan x="600" dy="25">differences between</tspan><tspan x="600" dy="25">the two groups</tspan><tspan x="600" dy="25">at the start</tspan></text><rect x="60.0" y="500" width="1080" height="58" rx="18" fill="#FFF7E3" stroke="#A47712" stroke-width="2" /><text x="600" y="539" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1B2A4A">Planned for two weeks. Closed after six days. “It was no longer apparent where reality ended and their roles began.”</text><text x="600" y="610" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#6F7985">Zimbardo et al. 1974; 10 prisoners and 11 guards selected from over 75 volunteers</text>
</svg>
