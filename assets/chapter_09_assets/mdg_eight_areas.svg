<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">The Millennium Project's eight target areas</title>
  <desc id="desc">Eight numbered cards: poverty, education, gender equality, child mortality, maternal health, disease, the environment, and global partnership. A banner reads: main objective, halve extreme poverty worldwide by 2015; 21 targets and more than 60 indicators.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="610" fill="#FCFCFA"/>
  <text x="600" y="56" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B2A4A">THE MILLENNIUM PROJECT’S EIGHT TARGET AREAS (2000)</text><rect x="50" y="100" width="260" height="140" rx="20" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="50" y="100" width="260" height="10" rx="5" fill="#C65D4B" stroke="none" stroke-width="0" /><text x="90" y="162" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#C65D4B">1</text><text x="180" y="205" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B2A4A">Poverty</text><rect x="330" y="100" width="260" height="140" rx="20" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="330" y="100" width="260" height="10" rx="5" fill="#A47712" stroke="none" stroke-width="0" /><text x="370" y="162" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#A47712">2</text><text x="460" y="205" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B2A4A">Education</text><rect x="610" y="100" width="260" height="140" rx="20" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="610" y="100" width="260" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><text x="650" y="162" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#147D79">3</text><text x="740" y="205" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B2A4A">Gender equality</text><rect x="890" y="100" width="260" height="140" rx="20" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="890" y="100" width="260" height="10" rx="5" fill="#1B2A4A" stroke="none" stroke-width="0" /><text x="930" y="162" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#1B2A4A">4</text><text x="1020" y="205" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B2A4A">Child mortality</text><rect x="50" y="270" width="260" height="140" rx="20" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="50" y="270" width="260" height="10" rx="5" fill="#1B2A4A" stroke="none" stroke-width="0" /><text x="90" y="332" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#1B2A4A">5</text><text x="180" y="375" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B2A4A">Maternal health</text><rect x="330" y="270" width="260" height="140" rx="20" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="330" y="270" width="260" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><text x="370" y="332" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#147D79">6</text><text x="460" y="375" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B2A4A">Disease</text><rect x="610" y="270" width="260" height="140" rx="20" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="610" y="270" width="260" height="10" rx="5" fill="#A47712" stroke="none" stroke-width="0" /><text x="650" y="332" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#A47712">7</text><text x="740" y="375" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B2A4A">The environment</text><rect x="890" y="270" width="260" height="140" rx="20" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="890" y="270" width="260" height="10" rx="5" fill="#C65D4B" stroke="none" stroke-width="0" /><text x="930" y="332" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#C65D4B">8</text><text x="1020" y="375" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B2A4A">Global partnership</text><rect x="50" y="455" width="1100" height="70" rx="18" fill="#FFF7E3" stroke="#A47712" stroke-width="2" /><text x="600" y="499" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1B2A4A">Goal: halve extreme poverty by 2015 · 21 targets · more than 60 indicators</text><text x="600" y="580" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#6F7985">United Nations, as reported in Schaefer. Instructor illustration.</text>
</svg>
