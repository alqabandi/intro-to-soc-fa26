<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">From colonialism to neocolonialism</title>
  <desc id="desc">Three cards linked by arrows. Colonialism: rule by outsiders, in which a foreign power holds political, social, economic, and cultural domination for an extended period. Independence: by the 1980s most former colonies had their own governments. Neocolonialism: continuing dependence on industrialized nations for managerial and technical expertise, investment capital, and manufactured goods. A banner reads: political rule ended; economic dependence and foreign domination continued.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="620" fill="#FCFCFA"/>
  <text x="600" y="56" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B2A4A">FROM COLONIALISM TO NEOCOLONIALISM</text><rect x="50" y="100" width="330" height="330" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="50" y="100" width="330" height="10" rx="5" fill="#C65D4B" stroke="none" stroke-width="0" /><text x="215.0" y="158" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1B2A4A">Colonialism</text><text x="215.0" y="205" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="500" fill="#25313D"><tspan x="215.0" dy="0">Rule by outsiders:</tspan><tspan x="215.0" dy="31">a foreign power holds</tspan><tspan x="215.0" dy="31">political, social,</tspan><tspan x="215.0" dy="31">economic, and cultural</tspan><tspan x="215.0" dy="31">domination for an</tspan><tspan x="215.0" dy="31">extended period</tspan></text><rect x="435" y="160" width="330" height="210" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="435" y="160" width="330" height="10" rx="5" fill="#A47712" stroke="none" stroke-width="0" /><text x="600.0" y="218" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B2A4A">Independence</text><text x="600.0" y="265" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="500" fill="#25313D"><tspan x="600.0" dy="0">By the 1980s, most</tspan><tspan x="600.0" dy="31">former colonies had</tspan><tspan x="600.0" dy="31">their own governments</tspan></text><rect x="820" y="100" width="330" height="330" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="820" y="100" width="330" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><text x="985.0" y="158" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1B2A4A">Neocolonialism</text><text x="985.0" y="205" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="500" fill="#25313D"><tspan x="985.0" dy="0">Continuing dependence</tspan><tspan x="985.0" dy="31">on industrialized nations</tspan><tspan x="985.0" dy="31">for managerial and</tspan><tspan x="985.0" dy="31">technical expertise,</tspan><tspan x="985.0" dy="31">investment capital, and</tspan><tspan x="985.0" dy="31">manufactured goods</tspan></text><line x1="388" y1="265" x2="427" y2="265" stroke="#1B2A4A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="773" y1="265" x2="812" y2="265" stroke="#1B2A4A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="50" y="470" width="1100" height="70" rx="18" fill="#FFF7E3" stroke="#A47712" stroke-width="2" /><text x="600" y="514" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B2A4A">Political rule ended; economic dependence and foreign domination continued.</text><text x="600" y="590" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#6F7985">Definitions from Schaefer. Instructor illustration.</text>
</svg>
