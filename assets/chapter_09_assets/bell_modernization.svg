<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Wendell Bell: what modernization changes</title>
  <desc id="desc">Six rows, each with an arrow from a traditional trait to a modern one: rural to urban; less literate to literate; agricultural to industrial; simple to sophisticated transportation and media; extended family to nuclear family; allegiance to parents and priests to allegiance to government officials.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="#FCFCFA"/>
  <text x="600" y="56" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B2A4A">WENDELL BELL: WHAT MODERNIZATION CHANGES</text><text x="330" y="112" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#C65D4B">Traditional or less developed</text><text x="870" y="112" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#147D79">Modern</text><rect x="90" y="135" width="480" height="52" rx="14" fill="#F9E9E6" stroke="none" stroke-width="0" /><text x="330" y="169" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#25313D">Rural</text><line x1="585" y1="161" x2="618" y2="161" stroke="#1B2A4A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="630" y="135" width="480" height="52" rx="14" fill="#EAF6F5" stroke="none" stroke-width="0" /><text x="870" y="169" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#25313D">Urban</text><rect x="90" y="201" width="480" height="52" rx="14" fill="#F9E9E6" stroke="none" stroke-width="0" /><text x="330" y="235" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#25313D">Less literate</text><line x1="585" y1="227" x2="618" y2="227" stroke="#1B2A4A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="630" y="201" width="480" height="52" rx="14" fill="#EAF6F5" stroke="none" stroke-width="0" /><text x="870" y="235" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#25313D">Literate</text><rect x="90" y="267" width="480" height="52" rx="14" fill="#F9E9E6" stroke="none" stroke-width="0" /><text x="330" y="301" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#25313D">Agricultural</text><line x1="585" y1="293" x2="618" y2="293" stroke="#1B2A4A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="630" y="267" width="480" height="52" rx="14" fill="#EAF6F5" stroke="none" stroke-width="0" /><text x="870" y="301" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#25313D">Industrial</text><rect x="90" y="333" width="480" height="52" rx="14" fill="#F9E9E6" stroke="none" stroke-width="0" /><text x="330" y="367" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#25313D">Simple transportation and media</text><line x1="585" y1="359" x2="618" y2="359" stroke="#1B2A4A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="630" y="333" width="480" height="52" rx="14" fill="#EAF6F5" stroke="none" stroke-width="0" /><text x="870" y="367" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#25313D">Sophisticated transportation and media</text><rect x="90" y="399" width="480" height="52" rx="14" fill="#F9E9E6" stroke="none" stroke-width="0" /><text x="330" y="433" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#25313D">Extended family</text><line x1="585" y1="425" x2="618" y2="425" stroke="#1B2A4A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="630" y="399" width="480" height="52" rx="14" fill="#EAF6F5" stroke="none" stroke-width="0" /><text x="870" y="433" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#25313D">Nuclear family</text><rect x="90" y="465" width="480" height="52" rx="14" fill="#F9E9E6" stroke="none" stroke-width="0" /><text x="330" y="499" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#25313D">Allegiance to parents and priests</text><line x1="585" y1="491" x2="618" y2="491" stroke="#1B2A4A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="630" y="465" width="480" height="52" rx="14" fill="#EAF6F5" stroke="none" stroke-width="0" /><text x="870" y="499" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#25313D">Allegiance to government officials</text><text x="600" y="572" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#6F7985">Bell 1981, as reported in Schaefer. The left column restates Bell’s traits in reverse; instructor illustration.</text>
</svg>
