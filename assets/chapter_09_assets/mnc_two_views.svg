<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Multinational corporations: functionalist and conflict views</title>
  <desc id="desc">Two panels. Functionalist view, multinationals can help developing nations: they bring jobs and industry where subsistence farming was the only means of survival; they spread inventions and innovations from industrialized nations; they make nations interdependent, which may keep disputes from becoming serious conflict. Conflict view, multinationals exploit workers for profit: they move factories to wherever labor is cheapest, as Nike moved from the United States to Korea to Indonesia to Vietnam; they benefit from weak unions and antilabor laws passed to create a climate for investment; they increase inequality within host nations and force out local businesses.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="620" fill="#FCFCFA"/>
  <rect x="40" y="30" width="545" height="520" rx="24" fill="#EAF6F5" stroke="none" stroke-width="0" /><rect x="615" y="30" width="545" height="520" rx="24" fill="#F9E9E6" stroke="none" stroke-width="0" /><text x="312" y="82" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#147D79">FUNCTIONALIST VIEW</text><text x="887" y="82" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#C65D4B">CONFLICT VIEW</text><text x="312" y="116" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#25313D">Multinationals can help developing nations</text><text x="887" y="116" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#25313D">Multinationals exploit workers for profit</text><rect x="70" y="150" width="485" height="108" rx="16" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" /><text x="312" y="184" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" fill="#25313D"><tspan x="312" dy="0">Bring jobs and industry where</tspan><tspan x="312" dy="27">subsistence farming was the</tspan><tspan x="312" dy="27">only means of survival</tspan></text><rect x="645" y="150" width="485" height="108" rx="16" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" /><text x="887" y="184" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" fill="#25313D"><tspan x="887" dy="0">Move factories to wherever</tspan><tspan x="887" dy="27">labor is cheapest; Nike went</tspan><tspan x="887" dy="27">U.S. → Korea → Indonesia → Vietnam</tspan></text><rect x="70" y="278" width="485" height="108" rx="16" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" /><text x="312" y="312" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" fill="#25313D"><tspan x="312" dy="0">Spread inventions and</tspan><tspan x="312" dy="27">innovations from</tspan><tspan x="312" dy="27">industrialized nations</tspan></text><rect x="645" y="278" width="485" height="108" rx="16" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" /><text x="887" y="312" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" fill="#25313D"><tspan x="887" dy="0">Benefit from weak unions and</tspan><tspan x="887" dy="27">antilabor laws passed to create</tspan><tspan x="887" dy="27">a “climate for investment”</tspan></text><rect x="70" y="406" width="485" height="108" rx="16" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" /><text x="312" y="440" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" fill="#25313D"><tspan x="312" dy="0">Make nations interdependent,</tspan><tspan x="312" dy="27">which may keep disputes from</tspan><tspan x="312" dy="27">becoming serious conflict</tspan></text><rect x="645" y="406" width="485" height="108" rx="16" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" /><text x="887" y="440" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" fill="#25313D"><tspan x="887" dy="0">Increase inequality within</tspan><tspan x="887" dy="27">host nations and force out</tspan><tspan x="887" dy="27">local businesses</tspan></text><text x="600" y="590" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#6F7985">Schaefer, drawing on Chase-Dunn and Grimes 1995; Kerbo 2012; Wallerstein 1979b. Instructor illustration.</text>
