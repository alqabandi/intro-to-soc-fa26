<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">Dependency theory: how debt deepens dependence</title>
  <desc id="desc">Foreign aid, loans, and trade deficits lead to huge debts owed to industrialized nations. International financial institutions then press indebted nations to devalue their currencies, freeze workers' wages, privatize industry, and cut government services and employment. A banner reads: a growing share of developing nations' human and natural resources is redistributed to the core industrialized nations.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="610" fill="#FCFCFA"/>
  <text x="600" y="56" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B2A4A">DEPENDENCY THEORY: HOW DEBT DEEPENS DEPENDENCE</text><rect x="50" y="110" width="260" height="70" rx="16" fill="#FFF7E3" stroke="#A47712" stroke-width="2" /><text x="180" y="155" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1B2A4A">Foreign aid</text><line x1="318" y1="145" x2="395" y2="240" stroke="#A47712" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="50" y="205" width="260" height="70" rx="16" fill="#FFF7E3" stroke="#A47712" stroke-width="2" /><text x="180" y="250" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1B2A4A">Loans</text><line x1="318" y1="240" x2="395" y2="240" stroke="#A47712" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="50" y="300" width="260" height="70" rx="16" fill="#FFF7E3" stroke="#A47712" stroke-width="2" /><text x="180" y="345" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1B2A4A">Trade deficits</text><line x1="318" y1="335" x2="395" y2="240" stroke="#A47712" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="400" y="180" width="275" height="120" rx="20" fill="#C65D4B" stroke="none" stroke-width="0" /><text x="537" y="230" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF"><tspan x="537" dy="0">Huge debts to</tspan><tspan x="537" dy="30">industrialized nations</tspan></text><line x1="683" y1="240" x2="730" y2="240" stroke="#1B2A4A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="740" y="110" width="410" height="260" rx="20" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="740" y="110" width="410" height="10" rx="5" fill="#1B2A4A" stroke="none" stroke-width="0" /><text x="945" y="160" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B2A4A"><tspan x="945" dy="0">International financial</tspan><tspan x="945" dy="28">institutions press nations to:</tspan></text><text x="945" y="236" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" fill="#25313D"><tspan x="945" dy="0">Devalue their currencies</tspan><tspan x="945" dy="30">Freeze workers’ wages</tspan><tspan x="945" dy="30">Privatize industry</tspan><tspan x="945" dy="30">Cut government services and jobs</tspan></text><rect x="50" y="420" width="1100" height="100" rx="18" fill="#EAF6F5" stroke="#147D79" stroke-width="2" /><text x="600" y="462" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1B2A4A"><tspan x="600" dy="0">A growing share of developing nations’ human and natural resources</tspan><tspan x="600" dy="32">is redistributed to the core industrialized nations.</tspan></text><text x="600" y="580" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#6F7985">Schaefer, drawing on world systems analysts and dependency theorists. Instructor illustration.</text>
</svg>
