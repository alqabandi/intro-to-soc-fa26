<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Four systems of stratification, from closed to open</title>
  <desc id="desc">Four cards arranged from closed to open. Slavery: people are owned by others and treated as property. Castes: hereditary ranks, usually religiously dictated, with marriage within the caste. Estates: in feudal Europe, nobles owned land and peasants worked it in exchange for protection. Social classes: a ranking based on economic position in which achievement can change one's place. An arrow runs from closed systems, where position is ascribed at birth, to open systems, where achieved status can bring mobility. A banner notes that these are ideal types and real societies may combine more than one.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="590" fill="#FCFCFA"/>
  <text x="600" y="56" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B2A4A">FOUR SYSTEMS OF STRATIFICATION, FROM CLOSED TO OPEN</text><rect x="45" y="100" width="260" height="270" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="45" y="100" width="260" height="10" rx="5" fill="#C65D4B" stroke="none" stroke-width="0" /><text x="175.0" y="158" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B2A4A">Slavery</text><text x="175.0" y="205" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="500" fill="#25313D"><tspan x="175.0" dy="0">People are owned</tspan><tspan x="175.0" dy="30">by others and</tspan><tspan x="175.0" dy="30">treated as</tspan><tspan x="175.0" dy="30">property</tspan></text><rect x="330" y="100" width="260" height="270" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="330" y="100" width="260" height="10" rx="5" fill="#A47712" stroke="none" stroke-width="0" /><text x="460.0" y="158" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B2A4A">Castes</text><text x="460.0" y="205" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="500" fill="#25313D"><tspan x="460.0" dy="0">Hereditary ranks,</tspan><tspan x="460.0" dy="30">usually religiously</tspan><tspan x="460.0" dy="30">dictated; marriage</tspan><tspan x="460.0" dy="30">within the caste</tspan></text><rect x="615" y="100" width="260" height="270" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="615" y="100" width="260" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><text x="745.0" y="158" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B2A4A">Estates</text><text x="745.0" y="205" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="500" fill="#25313D"><tspan x="745.0" dy="0">Feudal Europe:</tspan><tspan x="745.0" dy="30">nobles own land;</tspan><tspan x="745.0" dy="30">peasants work it</tspan><tspan x="745.0" dy="30">for protection</tspan></text><rect x="900" y="100" width="260" height="270" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="900" y="100" width="260" height="10" rx="5" fill="#1B2A4A" stroke="none" stroke-width="0" /><text x="1030.0" y="158" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B2A4A">Social classes</text><text x="1030.0" y="205" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="500" fill="#25313D"><tspan x="1030.0" dy="0">Ranking by</tspan><tspan x="1030.0" dy="30">economic position;</tspan><tspan x="1030.0" dy="30">achievement can</tspan><tspan x="1030.0" dy="30">change your place</tspan></text><line x1="110" y1="425" x2="1090" y2="425" stroke="#1B2A4A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="110" y="462" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#C65D4B">Closed: position ascribed at birth</text><text x="1090" y="462" text-anchor="end" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1B2A4A">Open: achieved status can bring mobility</text><rect x="70.0" y="500" width="1060" height="58" rx="18" fill="#EEF2F7" stroke="#1B2A4A" stroke-width="2" /><text x="600" y="539" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B2A4A">Ideal types: any real society may combine elements of more than one system.</text>
</svg>
