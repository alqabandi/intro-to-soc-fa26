<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Horizontal and vertical mobility on the prestige scale</title>
  <desc id="desc">A vertical prestige scale. An elementary school teacher scores 60. Moving to police officer, also 60, is horizontal mobility. Moving to lawyer, 76, is upward vertical mobility. Moving to bank teller, 50, is downward vertical mobility.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#FCFCFA"/>
  <text x="600" y="52" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#1B2A4A">HORIZONTAL AND VERTICAL MOBILITY ON THE PRESTIGE SCALE</text><line x1="120" y1="560" x2="120" y2="100" stroke="#6F7985" stroke-width="3" stroke-linecap="round"/><line x1="112" y1="560.0" x2="120" y2="560.0" stroke="#6F7985" stroke-width="2" stroke-linecap="round"/><text x="104" y="566.0" text-anchor="end" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#6F7985">40</text><line x1="112" y1="457.77777777777777" x2="120" y2="457.77777777777777" stroke="#6F7985" stroke-width="2" stroke-linecap="round"/><text x="104" y="463.77777777777777" text-anchor="end" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#6F7985">50</text><line x1="112" y1="355.55555555555554" x2="120" y2="355.55555555555554" stroke="#6F7985" stroke-width="2" stroke-linecap="round"/><text x="104" y="361.55555555555554" text-anchor="end" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#6F7985">60</text><line x1="112" y1="253.33333333333337" x2="120" y2="253.33333333333337" stroke="#6F7985" stroke-width="2" stroke-linecap="round"/><text x="104" y="259.33333333333337" text-anchor="end" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#6F7985">70</text><line x1="112" y1="151.11111111111114" x2="120" y2="151.11111111111114" stroke="#6F7985" stroke-width="2" stroke-linecap="round"/><text x="104" y="157.11111111111114" text-anchor="end" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#6F7985">80</text><text x="120" y="82" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#6F7985">Prestige score (0–100)</text><rect x="160" y="325.55555555555554" width="340" height="60" rx="14" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="3" /><text x="330.0" y="363.55555555555554" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1B2A4A">Elementary school teacher · 60</text><rect x="840" y="325.55555555555554" width="300" height="60" rx="14" fill="#FFFFFF" stroke="#147D79" stroke-width="3" /><text x="990.0" y="363.55555555555554" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#147D79">Police officer · 60</text><rect x="540" y="162.0" width="240" height="60" rx="14" fill="#FFFFFF" stroke="#A47712" stroke-width="3" /><text x="660.0" y="200.0" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#A47712">Lawyer · 76</text><rect x="540" y="427.77777777777777" width="240" height="60" rx="14" fill="#FFFFFF" stroke="#C65D4B" stroke-width="3" /><text x="660.0" y="465.77777777777777" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#C65D4B">Bank teller · 50</text><line x1="500" y1="355.55555555555554" x2="832" y2="355.55555555555554" stroke="#147D79" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="668" y="341.55555555555554" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#147D79">Horizontal mobility</text><line x1="420" y1="323.55555555555554" x2="535" y2="214.0" stroke="#A47712" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="455" y="247.33333333333337" text-anchor="end" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#A47712">Upward</text><line x1="420" y1="387.55555555555554" x2="535" y2="435.77777777777777" stroke="#C65D4B" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="455" y="426.8888888888889" text-anchor="end" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#C65D4B">Downward</text><rect x="830" y="152.0" width="330" height="80" rx="14" fill="#FFF7E3" stroke="#A47712" stroke-width="2" /><text x="995" y="184.0" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#1B2A4A"><tspan x="995" dy="0">Vertical mobility: a move</tspan><tspan x="995" dy="24">to a position of different rank</tspan></text><text x="600" y="620" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#6F7985">Prestige scores from Schaefer’s Table 8-3, as quoted in the text. Sorokin [1927] 1959 first drew the distinction.</text>
</svg>
