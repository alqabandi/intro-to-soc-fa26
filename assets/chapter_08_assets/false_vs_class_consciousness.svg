<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">False consciousness and class consciousness</title>
  <desc id="desc">Two panels. False consciousness: a single worker says, I am being exploited by my boss, and thinks as an individual. Class consciousness: a group of workers say, we are all exploited by the bourgeoisie, and see a shared interest and act together.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="440" fill="#FCFCFA"/>
  <rect x="40" y="30" width="540" height="380" rx="24" fill="#F9E9E6" stroke="none" stroke-width="0" /><rect x="620" y="30" width="540" height="380" rx="24" fill="#EAF6F5" stroke="none" stroke-width="0" /><text x="310" y="78" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#C65D4B">FALSE CONSCIOUSNESS</text><text x="890" y="78" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#147D79">CLASS CONSCIOUSNESS</text><rect x="90" y="105" width="440" height="76" rx="20" fill="#FFFFFF" stroke="#C65D4B" stroke-width="3" /><path d="M 296 179 L 310 207 L 324 179" fill="#FFFFFF" stroke="#C65D4B" stroke-width="3" stroke-linejoin="round"/><rect x="298" y="178" width="24" height="5" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0" /><text x="310.0" y="150.0" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1B2A4A">“I am being exploited by my boss.”</text><circle cx="310" cy="245" r="22.0" fill="#C65D4B"/><rect x="278.0" y="273.0" width="64.0" height="70.0" rx="26.0" fill="#C65D4B" stroke="none" stroke-width="0" /><text x="310" y="385" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#25313D">Thinks as an individual</text><rect x="640" y="105" width="500" height="76" rx="20" fill="#FFFFFF" stroke="#147D79" stroke-width="3" /><path d="M 876 179 L 890 207 L 904 179" fill="#FFFFFF" stroke="#147D79" stroke-width="3" stroke-linejoin="round"/><rect x="878" y="178" width="24" height="5" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0" /><text x="890.0" y="150.0" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1B2A4A">“We are all exploited by the bourgeoisie.”</text><circle cx="740" cy="262" r="18.04" fill="#147D79"/><rect x="713.76" y="284.96000000000004" width="52.48" height="57.4" rx="21.32" fill="#147D79" stroke="none" stroke-width="0" /><circle cx="815" cy="262" r="18.04" fill="#147D79"/><rect x="788.76" y="284.96000000000004" width="52.48" height="57.4" rx="21.32" fill="#147D79" stroke="none" stroke-width="0" /><circle cx="890" cy="250" r="18.04" fill="#147D79"/><rect x="863.76" y="272.96000000000004" width="52.48" height="57.4" rx="21.32" fill="#147D79" stroke="none" stroke-width="0" /><circle cx="965" cy="262" r="18.04" fill="#147D79"/><rect x="938.76" y="284.96000000000004" width="52.48" height="57.4" rx="21.32" fill="#147D79" stroke="none" stroke-width="0" /><circle cx="1040" cy="262" r="18.04" fill="#147D79"/><rect x="1013.76" y="284.96000000000004" width="52.48" height="57.4" rx="21.32" fill="#147D79" stroke="none" stroke-width="0" /><text x="890" y="385" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#25313D">Sees a shared interest and acts together</text>
</svg>
