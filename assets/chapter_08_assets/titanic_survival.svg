<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Who survived the Titanic, 1912?</title>
  <desc id="desc">Two bars. About 62 percent of first-class passengers survived; only 25 percent of third-class passengers survived. The ship carried too few lifeboats, and third-class passengers were alerted last.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#FCFCFA"/>
  <text x="600" y="52" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B2A4A">WHO SURVIVED THE TITANIC, 1912?</text><rect x="330" y="259.2" width="180" height="210.8" rx="8" fill="#1B2A4A" stroke="none" stroke-width="0" /><text x="420" y="241.2" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#1B2A4A">About 62%</text><text x="420" y="510" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1B2A4A">First-class passengers</text><text x="420" y="538" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" fill="#6F7985">survived</text><rect x="690" y="385.0" width="180" height="85.0" rx="8" fill="#C65D4B" stroke="none" stroke-width="0" /><text x="780" y="367.0" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#C65D4B">Only 25%</text><text x="780" y="510" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1B2A4A">Third-class passengers</text><text x="780" y="538" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" fill="#6F7985">survived</text><line x1="260" y1="470" x2="940" y2="470" stroke="#6F7985" stroke-width="3" stroke-linecap="round"/><text x="600" y="600" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#6F7985">The ship carried too few lifeboats, and third-class passengers were alerted last. Butler 1998; Crouse 1999.</text>
</svg>
