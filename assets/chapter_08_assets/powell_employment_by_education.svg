<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">Employment among U.S. working-age men, by education, 1967 and 2017</title>
  <desc id="desc">A slope chart with three lines. Men with a college degree: employment fell from more than 95 percent in 1967 to around 90 percent in 2017. Men with a high school diploma: from 95 percent to about 80 percent. Men without a high school diploma: from about 90 percent to a bit more than 70 percent. The less education, the steeper the fall.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="640" fill="#FCFCFA"/>
  <text x="600" y="52" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B2A4A">EMPLOYMENT AMONG U.S. WORKING-AGE MEN, BY EDUCATION</text><line x1="360" y1="105" x2="360" y2="525" stroke="#DDE3EA" stroke-width="2" stroke-linecap="round"/><line x1="820" y1="105" x2="820" y2="525" stroke="#DDE3EA" stroke-width="2" stroke-linecap="round"/><text x="360" y="560" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B2A4A">1967</text><text x="820" y="560" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B2A4A">2017</text><line x1="360" y1="183.42857142857144" x2="820" y2="248.57142857142856" stroke="#1B2A4A" stroke-width="6" stroke-linecap="round"/><circle cx="360" cy="183.42857142857144" r="9" fill="#1B2A4A"/><circle cx="820" cy="248.57142857142856" r="9" fill="#1B2A4A"/><text x="338" y="169.42857142857144" text-anchor="end" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1B2A4A">more than 95%</text><text x="842" y="244.57142857142856" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1B2A4A">College degree</text><text x="842" y="270.57142857142856" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#25313D">around 90%</text><line x1="360" y1="194.28571428571428" x2="820" y2="357.1428571428571" stroke="#147D79" stroke-width="6" stroke-linecap="round"/><circle cx="360" cy="194.28571428571428" r="9" fill="#147D79"/><circle cx="820" cy="357.1428571428571" r="9" fill="#147D79"/><text x="338" y="224.28571428571428" text-anchor="end" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#147D79">95%</text><text x="842" y="353.1428571428571" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#147D79">High school diploma</text><text x="842" y="379.1428571428571" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#25313D">about 80%</text><line x1="360" y1="248.57142857142856" x2="820" y2="454.8571428571429" stroke="#C65D4B" stroke-width="6" stroke-linecap="round"/><circle cx="360" cy="248.57142857142856" r="9" fill="#C65D4B"/><circle cx="820" cy="454.8571428571429" r="9" fill="#C65D4B"/><text x="338" y="260.57142857142856" text-anchor="end" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#C65D4B">about 90%</text><text x="842" y="450.8571428571429" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#C65D4B">No high school diploma</text><text x="842" y="476.8571428571429" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#25313D">a bit more than 70%</text><text x="600" y="610" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#6F7985">Powell 2019, as reported in Schaefer. Values are the approximate figures given in the text.</text>
</svg>
