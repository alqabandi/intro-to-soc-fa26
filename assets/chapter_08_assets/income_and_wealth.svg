<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Income is what comes in; wealth is what you own</title>
  <desc id="desc">Four income sources on the left: salaries and wages, interest on savings, stock dividends, and rental income. Arrows lead to a large box labelled wealth, all of a person's material assets, containing land, stocks, and other property. A dashed arrow returns from wealth to income: wealth can produce income, as shares pay dividends and buildings pay rent.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="630" fill="#FCFCFA"/>
  <text x="600" y="52" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B2A4A">INCOME IS WHAT COMES IN; WEALTH IS WHAT YOU OWN</text><rect x="60" y="120" width="330" height="60" rx="14" fill="#FFF7E3" stroke="#A47712" stroke-width="2" /><text x="225" y="159" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1B2A4A">Salaries and wages</text><line x1="398" y1="150" x2="540" y2="200" stroke="#A47712" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="60" y="202" width="330" height="60" rx="14" fill="#FFF7E3" stroke="#A47712" stroke-width="2" /><text x="225" y="241" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1B2A4A">Interest on savings</text><line x1="398" y1="232" x2="540" y2="250" stroke="#A47712" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="60" y="284" width="330" height="60" rx="14" fill="#FFF7E3" stroke="#A47712" stroke-width="2" /><text x="225" y="323" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1B2A4A">Stock dividends</text><line x1="398" y1="314" x2="540" y2="300" stroke="#A47712" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="60" y="366" width="330" height="60" rx="14" fill="#FFF7E3" stroke="#A47712" stroke-width="2" /><text x="225" y="405" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1B2A4A">Rental income</text><line x1="398" y1="396" x2="540" y2="350" stroke="#A47712" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><text x="225" y="100" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#A47712">INCOME</text><rect x="560" y="100" width="580" height="340" rx="24" fill="#EAF6F5" stroke="#147D79" stroke-width="3" /><text x="850" y="145" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#147D79">WEALTH</text><text x="850" y="178" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#25313D">All of a person’s material assets</text><rect x="580" y="215" width="170" height="150" rx="16" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><text x="665" y="298" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B2A4A">Land</text><rect x="765" y="215" width="170" height="150" rx="16" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><text x="850" y="298" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B2A4A">Stocks</text><rect x="950" y="215" width="170" height="150" rx="16" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><text x="1035" y="298" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B2A4A">Other property</text><path d="M 850 445 C 850 520, 225 520, 225 458" fill="none" stroke="#147D79" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/><text x="600" y="548" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#147D79">Wealth can produce income: shares pay dividends, buildings pay rent.</text><text x="600" y="600" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#6F7985">Definitions from Schaefer. Instructor illustration.</text>
</svg>
