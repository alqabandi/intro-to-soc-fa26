<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Atchley's seven phases of retirement</title>
  <desc id="desc">Preretirement, near phase, honeymoon, disenchantment, reorientation, stability, termination.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#147D79" stroke="none"/>
    </marker>
    <marker id="arrow-gold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#A47712" stroke="none"/>
    </marker>
    <marker id="arrow-coral" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#C65D4B" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#FCFCFA"/>
  <text x="600" y="56" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#1B2A4A">ATCHLEY’S PHASES OF RETIREMENT (1976)</text><line x1="80" y1="300" x2="1130" y2="300" stroke="#1B2A4A" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="130" cy="300" r="30" fill="#FFFFFF" stroke="#147D79" stroke-width="7"/><text x="130" y="310" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#147D79">1</text><text x="130" y="230" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#147D79">Preretirement</text><text x="130" y="370" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" fill="#25313D"><tspan x="130" dy="0">Anticipatory</tspan><tspan x="130" dy="22">socialization</tspan></text><circle cx="285" cy="300" r="30" fill="#FFFFFF" stroke="#147D79" stroke-width="7"/><text x="285" y="310" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#147D79">2</text><text x="285" y="230" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#147D79">Near phase</text><text x="285" y="370" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" fill="#25313D"><tspan x="285" dy="0">A departure</tspan><tspan x="285" dy="22">date is set</tspan></text><circle cx="440" cy="300" r="30" fill="#FFFFFF" stroke="#A47712" stroke-width="7"/><text x="440" y="310" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#A47712">3</text><text x="440" y="230" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#A47712">Honeymoon</text><text x="440" y="370" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" fill="#25313D"><tspan x="440" dy="0">Pursuing long-</tspan><tspan x="440" dy="22">postponed activities</tspan></text><circle cx="595" cy="300" r="30" fill="#FFFFFF" stroke="#C65D4B" stroke-width="7"/><text x="595" y="310" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#C65D4B">4</text><text x="595" y="230" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#C65D4B">Disenchantment</text><text x="595" y="370" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" fill="#25313D"><tspan x="595" dy="0">Letdown, even</tspan><tspan x="595" dy="22">depression</tspan></text><circle cx="750" cy="300" r="30" fill="#FFFFFF" stroke="#A47712" stroke-width="7"/><text x="750" y="310" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#A47712">5</text><text x="750" y="230" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#A47712">Reorientation</text><text x="750" y="370" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" fill="#25313D"><tspan x="750" dy="0">A more realistic</tspan><tspan x="750" dy="22">view develops</tspan></text><circle cx="905" cy="300" r="30" fill="#FFFFFF" stroke="#147D79" stroke-width="7"/><text x="905" y="310" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#147D79">6</text><text x="905" y="230" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#147D79">Stability</text><text x="905" y="370" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" fill="#25313D"><tspan x="905" dy="0">Comfortable</tspan><tspan x="905" dy="22">life after work</tspan></text><circle cx="1060" cy="300" r="30" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="7"/><text x="1060" y="310" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B2A4A">7</text><text x="1060" y="230" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1B2A4A">Termination</text><text x="1060" y="370" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="500" fill="#25313D"><tspan x="1060" dy="0">Basic self-care</tspan><tspan x="1060" dy="22">no longer possible</tspan></text><rect x="150.0" y="500" width="900" height="58" rx="18" fill="#EEF2F7" stroke="#1B2A4A" stroke-width="2" /><text x="600" y="539" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B2A4A">A series of adjustments, not a single event; not everyone passes through every phase</text>
</svg>
