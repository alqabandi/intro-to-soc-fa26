<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Mead's three stages of the self</title>
  <desc id="desc">Preparatory stage (imitation, no self), play stage (taking the role of one other, self developing), game stage (several roles at once, self present).</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#147D79" stroke="none"/>
    </marker>
    <marker id="arrow-gold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#A47712" stroke="none"/>
    </marker>
    <marker id="arrow-coral" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#C65D4B" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#FCFCFA"/>
  <text x="600" y="58" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#1B2A4A">MEAD’S STAGES OF THE SELF</text><rect x="90" y="330" width="320" height="260" rx="22" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="90" y="330" width="320" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><text x="250" y="382" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#147D79">Preparatory</text><text x="250" y="418" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B2A4A">Self present? No</text><text x="250" y="458" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#25313D"><tspan x="250" dy="0">Child imitates the</tspan><tspan x="250" dy="26">actions of others</tspan></text><text x="250" y="528" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" fill="#6F7985"><tspan x="250" dy="0">Adults laugh; the</tspan><tspan x="250" dy="25">child laughs too</tspan></text><rect x="440" y="270" width="320" height="320" rx="22" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="440" y="270" width="320" height="10" rx="5" fill="#A47712" stroke="none" stroke-width="0" /><text x="600" y="322" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#A47712">Play</text><text x="600" y="358" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B2A4A">Self present? Developing</text><text x="600" y="398" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#25313D"><tspan x="600" dy="0">Child takes the role of</tspan><tspan x="600" dy="26">a single other person</tspan></text><text x="600" y="468" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" fill="#6F7985"><tspan x="600" dy="0">First the doctor,</tspan><tspan x="600" dy="25">then the patient</tspan></text><rect x="790" y="210" width="320" height="380" rx="22" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="790" y="210" width="320" height="10" rx="5" fill="#C65D4B" stroke="none" stroke-width="0" /><text x="950" y="262" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#C65D4B">Game</text><text x="950" y="298" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B2A4A">Self present? Yes</text><text x="950" y="338" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#25313D"><tspan x="950" dy="0">Child considers the roles of</tspan><tspan x="950" dy="26">two or more others at once</tspan></text><text x="950" y="408" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" fill="#6F7985"><tspan x="950" dy="0">Hide-and-seek: both</tspan><tspan x="950" dy="25">hider and seeker</tspan></text><text x="600" y="628" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#1B2A4A">Role taking develops in the play stage; the generalized other appears in the game stage (about age 8 or 9)</text>
</svg>
