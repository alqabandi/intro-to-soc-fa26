<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Cooley, Mead, and Goffman compared</title>
  <desc id="desc">Cooley asks how the self is created, Mead how it develops, Goffman how it is presented.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#147D79" stroke="none"/>
    </marker>
    <marker id="arrow-gold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#A47712" stroke="none"/>
    </marker>
    <marker id="arrow-coral" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#C65D4B" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#FCFCFA"/>
  <text x="600" y="60" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B2A4A">THREE SOCIOLOGISTS, THREE QUESTIONS ABOUT THE SELF</text><rect x="80" y="120" width="320" height="380" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="80" y="120" width="320" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><text x="240" y="185" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#147D79">Cooley</text><text x="240" y="240" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#1B2A4A"><tspan x="240" dy="0">How is the self created?</tspan></text><line x1="140" y1="275" x2="340" y2="275" stroke="#DDE3EA" stroke-width="3" stroke-linecap="round"/><text x="240" y="320" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="500" fill="#25313D"><tspan x="240" dy="0">Looking-glass self</tspan></text><rect x="440" y="120" width="320" height="380" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="440" y="120" width="320" height="10" rx="5" fill="#A47712" stroke="none" stroke-width="0" /><text x="600" y="185" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#A47712">Mead</text><text x="600" y="240" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#1B2A4A"><tspan x="600" dy="0">How does the self develop?</tspan></text><line x1="500" y1="275" x2="700" y2="275" stroke="#DDE3EA" stroke-width="3" stroke-linecap="round"/><text x="600" y="320" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="500" fill="#25313D"><tspan x="600" dy="0">Preparatory, play, game</tspan><tspan x="600" dy="32">Generalized other</tspan></text><rect x="800" y="120" width="320" height="380" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="800" y="120" width="320" height="10" rx="5" fill="#C65D4B" stroke="none" stroke-width="0" /><text x="960" y="185" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#C65D4B">Goffman</text><text x="960" y="240" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#1B2A4A"><tspan x="960" dy="0">How is the self presented?</tspan></text><line x1="860" y1="275" x2="1060" y2="275" stroke="#DDE3EA" stroke-width="3" stroke-linecap="round"/><text x="960" y="320" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="500" fill="#25313D"><tspan x="960" dy="0">Impression management</tspan><tspan x="960" dy="32">Dramaturgical approach</tspan><tspan x="960" dy="32">Face-work</tspan></text><rect x="170.0" y="545" width="860" height="58" rx="18" fill="#EEF2F7" stroke="#1B2A4A" stroke-width="2" /><text x="600" y="584" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B2A4A">All three are interactionists: the self emerges from interaction with others</text>
</svg>
