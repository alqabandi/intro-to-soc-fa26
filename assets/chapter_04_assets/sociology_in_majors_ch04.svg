<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Socialization applied in four fields</title>
  <desc id="desc">Medicine, engineering, business, and computer science each meet socialization as a practical concern.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#147D79" stroke="none"/>
    </marker>
    <marker id="arrow-gold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#A47712" stroke="none"/>
    </marker>
    <marker id="arrow-coral" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#C65D4B" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="480" fill="#FCFCFA"/>
  <text x="600" y="58" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#1B2A4A">SOCIALIZATION IN YOUR FIELD</text><rect x="60" y="120" width="255" height="300" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="60" y="120" width="255" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><text x="187" y="185" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#147D79">Medicine</text><text x="187" y="245" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#25313D"><tspan x="187" dy="0">Attachment research</tspan><tspan x="187" dy="34">Screen-time guidance</tspan><tspan x="187" dy="34">Residency as</tspan><tspan x="187" dy="34">anticipatory socialization</tspan></text><rect x="335" y="120" width="255" height="300" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="335" y="120" width="255" height="10" rx="5" fill="#A47712" stroke="none" stroke-width="0" /><text x="462" y="185" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#A47712">Engineering</text><text x="462" y="245" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#25313D"><tspan x="462" dy="0">Site induction and</tspan><tspan x="462" dy="34">safety culture are</tspan><tspan x="462" dy="34">resocialization of</tspan><tspan x="462" dy="34">reflexes, not only skills</tspan></text><rect x="610" y="120" width="255" height="300" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="610" y="120" width="255" height="10" rx="5" fill="#C65D4B" stroke="none" stroke-width="0" /><text x="737" y="185" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#C65D4B">Business</text><text x="737" y="245" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#25313D"><tspan x="737" dy="0">The interview is</tspan><tspan x="737" dy="34">impression management</tspan><tspan x="737" dy="34">Onboarding is the</tspan><tspan x="737" dy="34">workplace agent at work</tspan></text><rect x="885" y="120" width="255" height="300" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="885" y="120" width="255" height="10" rx="5" fill="#1B2A4A" stroke="none" stroke-width="0" /><text x="1012" y="185" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B2A4A">Computer science</text><text x="1012" y="245" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#25313D"><tspan x="1012" dy="0">Platforms are agents</tspan><tspan x="1012" dy="34">by design: feeds,</tspan><tspan x="1012" dy="34">defaults, and privacy</tspan><tspan x="1012" dy="34">controls shape users</tspan></text>
</svg>
