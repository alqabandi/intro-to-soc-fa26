<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Rites of passage across the life course</title>
  <desc id="desc">Soboa at birth, Kota blue paint in adolescence, quinceanera at fifteen, Naval Academy graduation; rites mark separation or incorporation.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#147D79" stroke="none"/>
    </marker>
    <marker id="arrow-gold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#A47712" stroke="none"/>
    </marker>
    <marker id="arrow-coral" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#C65D4B" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#FCFCFA"/>
  <text x="600" y="56" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B2A4A">RITES OF PASSAGE MARK TRANSITIONS ACROSS THE LIFE COURSE</text><line x1="90" y1="320" x2="1120" y2="320" stroke="#1B2A4A" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="170" cy="320" r="40" fill="#FFFFFF" stroke="#147D79" stroke-width="8"/><circle cx="170" cy="320" r="14" fill="#147D79" stroke="none" stroke-width="2"/><text x="170" y="245" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#147D79">Birth</text><text x="170" y="400" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" fill="#25313D"><tspan x="170" dy="0">Egypt: the Soboa</tspan><tspan x="170" dy="26">mother steps over the</tspan><tspan x="170" dy="26">seven-day-old seven times</tspan></text><circle cx="430" cy="320" r="40" fill="#FFFFFF" stroke="#A47712" stroke-width="8"/><circle cx="430" cy="320" r="14" fill="#A47712" stroke="none" stroke-width="2"/><text x="430" y="245" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#A47712">Adolescence</text><text x="430" y="400" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" fill="#25313D"><tspan x="430" dy="0">Kota people, Congo:</tspan><tspan x="430" dy="26">adolescents painted blue,</tspan><tspan x="430" dy="26">the death of childhood</tspan></text><circle cx="690" cy="320" r="40" fill="#FFFFFF" stroke="#C65D4B" stroke-width="8"/><circle cx="690" cy="320" r="14" fill="#C65D4B" stroke="none" stroke-width="2"/><text x="690" y="245" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#C65D4B">Age 15</text><text x="690" y="400" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" fill="#25313D"><tspan x="690" dy="0">Quinceañera:</tspan><tspan x="690" dy="26">a girl’s passage</tspan><tspan x="690" dy="26">to womanhood</tspan></text><circle cx="950" cy="320" r="40" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="8"/><circle cx="950" cy="320" r="14" fill="#1B2A4A" stroke="none" stroke-width="2"/><text x="950" y="245" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1B2A4A">Graduation</text><text x="950" y="400" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" fill="#25313D"><tspan x="950" dy="0">U.S. Naval Academy:</tspan><tspan x="950" dy="26">hats thrown in the air</tspan></text><rect x="120" y="530" width="440" height="70" rx="18" fill="#EAF6F5" stroke="#147D79" stroke-width="2" /><text x="340" y="573" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1B2A4A">Separation: a graduation ceremony</text><rect x="640" y="530" width="440" height="70" rx="18" fill="#FFF7E3" stroke="#A47712" stroke-width="2" /><text x="860" y="573" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#1B2A4A">Incorporation: initiation into a group</text><text x="600" y="635" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#6F7985">Van Gennep [1909] 1960</text>
</svg>
