<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">How researchers separate heredity and environment</title>
  <desc id="desc">Isolation cases remove the social environment; twin studies hold heredity constant. The conclusion is nature and nurture.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#147D79" stroke="none"/>
    </marker>
    <marker id="arrow-gold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#A47712" stroke="none"/>
    </marker>
    <marker id="arrow-coral" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#C65D4B" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#FCFCFA"/>
  <text x="600" y="60" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1B2A4A">TO SEE EACH FACTOR, STUDY CASES WHERE ONE OPERATES ALMOST ALONE</text><rect x="70" y="110" width="500" height="360" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="70" y="110" width="500" height="10" rx="5" fill="#C65D4B" stroke="none" stroke-width="0" /><text x="320.0" y="168" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#1B2A4A">Environment nearly removed</text><text x="320.0" y="215" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="500" fill="#25313D"><tspan x="320.0" dy="0">Isabelle: six years in a darkened room</tspan><tspan x="320.0" dy="32">Romanian orphans: 18–20 hours a day in cribs</tspan><tspan x="320.0" dy="32">Harlow’s rhesus monkeys raised in isolation</tspan><tspan x="320.0" dy="32"> </tspan><tspan x="320.0" dy="32">Result: fear, apathy, no speech, no attachment</tspan></text><rect x="630" y="110" width="500" height="360" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="630" y="110" width="500" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><text x="880.0" y="168" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#1B2A4A">Heredity held constant</text><text x="880.0" y="215" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="500" fill="#25313D"><tspan x="880.0" dy="0">Identical twins reared apart</tspan><tspan x="880.0" dy="32">Same genes, different environments</tspan><tspan x="880.0" dy="32">Minnesota study: 137 sets of twins</tspan><tspan x="880.0" dy="32"> </tspan><tspan x="880.0" dy="32">Result: temperament alike; values differ</tspan></text><rect x="70.0" y="530" width="1060" height="58" rx="18" fill="#EEF2F7" stroke="#1B2A4A" stroke-width="2" /><text x="600" y="569" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B2A4A">Conclusion from more than 2,700 twin studies: not nature versus nurture, but nature and nurture</text>
</svg>
