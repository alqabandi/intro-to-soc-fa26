<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Piaget's four cognitive stages</title>
  <desc id="desc">Sensorimotor, preoperational, concrete operational, and formal operational stages along a timeline.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#147D79" stroke="none"/>
    </marker>
    <marker id="arrow-gold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#A47712" stroke="none"/>
    </marker>
    <marker id="arrow-coral" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#C65D4B" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#FCFCFA"/>
  <text x="600" y="58" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#1B2A4A">PIAGET’S COGNITIVE THEORY OF DEVELOPMENT</text><line x1="120" y1="300" x2="1090" y2="300" stroke="#1B2A4A" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="190" cy="300" r="42" fill="#FFFFFF" stroke="#147D79" stroke-width="8"/><circle cx="190" cy="300" r="15" fill="#147D79" stroke="none" stroke-width="2"/><text x="190" y="215" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#147D79">Sensorimotor</text><text x="190" y="385" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#25313D"><tspan x="190" dy="0">Discovery through</tspan><tspan x="190" dy="27">the senses: my hands</tspan><tspan x="190" dy="27">are part of me</tspan></text><circle cx="460" cy="300" r="42" fill="#FFFFFF" stroke="#A47712" stroke-width="8"/><circle cx="460" cy="300" r="15" fill="#A47712" stroke="none" stroke-width="2"/><text x="460" y="215" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#A47712">Preoperational</text><text x="460" y="385" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#25313D"><tspan x="460" dy="0">Words and symbols</tspan><tspan x="460" dy="27">distinguish objects</tspan><tspan x="460" dy="27">and ideas</tspan></text><circle cx="730" cy="300" r="42" fill="#FFFFFF" stroke="#C65D4B" stroke-width="8"/><circle cx="730" cy="300" r="15" fill="#C65D4B" stroke="none" stroke-width="2"/><text x="730" y="215" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#C65D4B">Concrete operational</text><text x="730" y="385" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#25313D"><tspan x="730" dy="0">Logical thinking: the clay</tspan><tspan x="730" dy="27">snake is still</tspan><tspan x="730" dy="27">the same clay</tspan></text><circle cx="1000" cy="300" r="42" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="8"/><circle cx="1000" cy="300" r="15" fill="#1B2A4A" stroke="none" stroke-width="2"/><text x="1000" y="215" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1B2A4A">Formal operational</text><text x="1000" y="385" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#25313D"><tspan x="1000" dy="0">Abstract thought;</tspan><tspan x="1000" dy="27">logic about ideas</tspan><tspan x="1000" dy="27">and values</tspan></text><rect x="240.0" y="540" width="720" height="58" rx="18" fill="#EAF6F5" stroke="#147D79" stroke-width="2" /><text x="600" y="579" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1B2A4A">For Piaget, social interaction is the key to development</text>
</svg>
