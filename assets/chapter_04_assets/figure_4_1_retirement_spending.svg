<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Figure 4-1: support for increased government spending on retirement</title>
  <desc id="desc">Spend much more 18 percent, more 44, the same 32, less 5, much less 1. Sixty-two percent want more spending.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#147D79" stroke="none"/>
    </marker>
    <marker id="arrow-gold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#A47712" stroke="none"/>
    </marker>
    <marker id="arrow-coral" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#C65D4B" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#FCFCFA"/>
  <text x="600" y="54" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1B2A4A">SHOULD GOVERNMENT SPEND MORE OR LESS ON RETIREMENT BENEFITS?</text><rect x="90" y="120" width="183.6" height="90" rx="0" fill="#1B2A4A" stroke="none" stroke-width="0" /><text x="181.8" y="175" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">18%</text><rect x="273.6" y="120" width="448.8" height="90" rx="0" fill="#147D79" stroke="none" stroke-width="0" /><text x="498.0" y="175" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">44%</text><rect x="722.4000000000001" y="120" width="326.4" height="90" rx="0" fill="#A47712" stroke="none" stroke-width="0" /><text x="885.6000000000001" y="175" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">32%</text><rect x="1048.8000000000002" y="120" width="51.0" height="90" rx="0" fill="#C65D4B" stroke="none" stroke-width="0" /><text x="1074.3000000000002" y="175" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">5%</text><rect x="1099.8000000000002" y="120" width="10.2" height="90" rx="0" fill="#9AA3AE" stroke="none" stroke-width="0" /><rect x="90" y="120" width="1020" height="90" rx="0" fill="none" stroke="#DDE3EA" stroke-width="2" /><rect x="110" y="270" width="28" height="28" rx="6" fill="#1B2A4A" stroke="none" stroke-width="0" /><text x="150" y="292" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#25313D">Spend much more: 18%</text><rect x="450" y="270" width="28" height="28" rx="6" fill="#147D79" stroke="none" stroke-width="0" /><text x="490" y="292" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#25313D">Spend more: 44%</text><rect x="790" y="270" width="28" height="28" rx="6" fill="#A47712" stroke="none" stroke-width="0" /><text x="830" y="292" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#25313D">Spend the same: 32%</text><rect x="110" y="330" width="28" height="28" rx="6" fill="#C65D4B" stroke="none" stroke-width="0" /><text x="150" y="352" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#25313D">Spend less: 5%</text><rect x="450" y="330" width="28" height="28" rx="6" fill="#9AA3AE" stroke="none" stroke-width="0" /><text x="490" y="352" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#25313D">Spend much less: 1%</text><rect x="130" y="430" width="940" height="120" rx="22" fill="#FFF7E3" stroke="#A47712" stroke-width="2" /><text x="600" y="480" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="32" font-weight="700" fill="#1B2A4A">62% want more or much more spending</text><text x="600" y="522" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="500" fill="#25313D">Respondents were not asked where the extra revenue would come from</text><text x="1110" y="625" text-anchor="end" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#6F7985">Source: 2016 survey data in NORC 2019</text>
</svg>
