<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Box 4-3: how often U.S. teens control access to their social media</title>
  <desc id="desc">Stacked bars: curating the feed 15/31/22/29; restricting posts for the future 9/23/26/37; restricting posts from parents 9/20/25/42.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#147D79" stroke="none"/>
    </marker>
    <marker id="arrow-gold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#A47712" stroke="none"/>
    </marker>
    <marker id="arrow-coral" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#C65D4B" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#FCFCFA"/>
  <text x="600" y="54" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1B2A4A">PERCENT OF U.S. TEENS WHO SAY THEY EVER DO THE FOLLOWING ON SOCIAL MEDIA</text><text x="90" y="106" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#25313D">Set up their feed to view only specific content</text><rect x="90" y="120" width="153.0" height="54" rx="0" fill="#1B2A4A" stroke="none" stroke-width="0" /><text x="166.5" y="156" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">15%</text><rect x="243.0" y="120" width="316.2" height="54" rx="0" fill="#147D79" stroke="none" stroke-width="0" /><text x="401.1" y="156" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">31%</text><rect x="559.2" y="120" width="224.4" height="54" rx="0" fill="#A47712" stroke="none" stroke-width="0" /><text x="671.4000000000001" y="156" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">22%</text><rect x="783.6" y="120" width="295.8" height="54" rx="0" fill="#D4DBE8" stroke="none" stroke-width="0" /><text x="931.5" y="156" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B2A4A">29%</text><rect x="90" y="120" width="1020" height="54" rx="0" fill="none" stroke="#DDE3EA" stroke-width="2" /><text x="90" y="256" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#25313D">Remove or limit viewing of posts that could hurt them in the future</text><rect x="90" y="270" width="91.8" height="54" rx="0" fill="#1B2A4A" stroke="none" stroke-width="0" /><text x="135.9" y="306" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">9%</text><rect x="181.8" y="270" width="234.6" height="54" rx="0" fill="#147D79" stroke="none" stroke-width="0" /><text x="299.1" y="306" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">23%</text><rect x="416.4" y="270" width="265.2" height="54" rx="0" fill="#A47712" stroke="none" stroke-width="0" /><text x="549.0" y="306" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">26%</text><rect x="681.5999999999999" y="270" width="377.4" height="54" rx="0" fill="#D4DBE8" stroke="none" stroke-width="0" /><text x="870.3" y="306" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B2A4A">37%</text><rect x="90" y="270" width="1020" height="54" rx="0" fill="none" stroke="#DDE3EA" stroke-width="2" /><text x="90" y="406" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#25313D">Remove or limit viewing of posts so parents cannot see them</text><rect x="90" y="420" width="91.8" height="54" rx="0" fill="#1B2A4A" stroke="none" stroke-width="0" /><text x="135.9" y="456" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">9%</text><rect x="181.8" y="420" width="204.0" height="54" rx="0" fill="#147D79" stroke="none" stroke-width="0" /><text x="283.8" y="456" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">20%</text><rect x="385.8" y="420" width="255.0" height="54" rx="0" fill="#A47712" stroke="none" stroke-width="0" /><text x="513.3" y="456" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF">25%</text><rect x="640.8" y="420" width="428.4" height="54" rx="0" fill="#D4DBE8" stroke="none" stroke-width="0" /><text x="855.0" y="456" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B2A4A">42%</text><rect x="90" y="420" width="1020" height="54" rx="0" fill="none" stroke="#DDE3EA" stroke-width="2" /><rect x="180" y="570" width="28" height="28" rx="6" fill="#1B2A4A" stroke="none" stroke-width="0" /><text x="220" y="592" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#25313D">Regularly</text><rect x="410" y="570" width="28" height="28" rx="6" fill="#147D79" stroke="none" stroke-width="0" /><text x="450" y="592" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#25313D">Occasionally</text><rect x="640" y="570" width="28" height="28" rx="6" fill="#A47712" stroke="none" stroke-width="0" /><text x="680" y="592" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#25313D">Hardly ever</text><rect x="870" y="570" width="28" height="28" rx="6" fill="#D4DBE8" stroke="none" stroke-width="0" /><text x="910" y="592" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#25313D">Never</text><text x="1110" y="632" text-anchor="end" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#6F7985">Source: Anderson and Jiang 2018b</text>
</svg>
