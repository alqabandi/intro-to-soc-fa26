<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Seven agents of socialization around a person</title>
  <desc id="desc">Family, school, peer group, media and technology, workplace, religion, and the state arranged in a ring around a person.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#147D79" stroke="none"/>
    </marker>
    <marker id="arrow-gold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#A47712" stroke="none"/>
    </marker>
    <marker id="arrow-coral" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#C65D4B" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#FCFCFA"/>
  <text x="600" y="56" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#1B2A4A">AGENTS OF SOCIALIZATION</text><ellipse cx="600" cy="350" rx="300" ry="210" fill="none" stroke="#DDE3EA" stroke-width="4"/><line x1="600" y1="350" x2="600.0" y2="140.0" stroke="#C9D1DB" stroke-width="3" stroke-linecap="round"/><rect x="505.0" y="110.0" width="190" height="60" rx="30" fill="#FFFFFF" stroke="#A47712" stroke-width="5" filter="url(#shadow)"/><text x="600.0" y="149.0" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#A47712">Family</text><line x1="600" y1="350" x2="834.5" y2="219.1" stroke="#C9D1DB" stroke-width="3" stroke-linecap="round"/><rect x="739.5" y="189.1" width="190" height="60" rx="30" fill="#FFFFFF" stroke="#147D79" stroke-width="5" filter="url(#shadow)"/><text x="834.5" y="228.1" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#147D79">School</text><line x1="600" y1="350" x2="892.5" y2="396.7" stroke="#C9D1DB" stroke-width="3" stroke-linecap="round"/><rect x="797.5" y="366.7" width="190" height="60" rx="30" fill="#FFFFFF" stroke="#C65D4B" stroke-width="5" filter="url(#shadow)"/><text x="892.5" y="405.7" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#C65D4B">Peer group</text><line x1="600" y1="350" x2="730.2" y2="539.2" stroke="#C9D1DB" stroke-width="3" stroke-linecap="round"/><rect x="605.2" y="509.20000000000005" width="250" height="60" rx="30" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="5" filter="url(#shadow)"/><text x="730.2" y="548.2" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B2A4A">Media and technology</text><line x1="600" y1="350" x2="469.8" y2="539.2" stroke="#C9D1DB" stroke-width="3" stroke-linecap="round"/><rect x="374.8" y="509.20000000000005" width="190" height="60" rx="30" fill="#FFFFFF" stroke="#147D79" stroke-width="5" filter="url(#shadow)"/><text x="469.8" y="548.2" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#147D79">Workplace</text><line x1="600" y1="350" x2="307.5" y2="396.7" stroke="#C9D1DB" stroke-width="3" stroke-linecap="round"/><rect x="212.5" y="366.7" width="190" height="60" rx="30" fill="#FFFFFF" stroke="#A47712" stroke-width="5" filter="url(#shadow)"/><text x="307.5" y="405.7" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#A47712">Religion</text><line x1="600" y1="350" x2="365.5" y2="219.1" stroke="#C9D1DB" stroke-width="3" stroke-linecap="round"/><rect x="270.5" y="189.1" width="190" height="60" rx="30" fill="#FFFFFF" stroke="#C65D4B" stroke-width="5" filter="url(#shadow)"/><text x="365.5" y="228.1" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#C65D4B">The state</text><circle cx="600" cy="350" r="72" fill="#EEF2F7" stroke="#1B2A4A" stroke-width="5"/><circle cx="600" cy="324.0" r="13.0" fill="#1B2A4A" stroke="none" stroke-width="2"/><path d="M 600 341.0 L 600 379.0 M 576.0 357.0 L 600 347.0 L 624.0 357.0 M 600 379.0 L 580.0 409.0 M 600 379.0 L 620.0 409.0" fill="none" stroke="#1B2A4A" stroke-width="7.0" stroke-linecap="round" stroke-linejoin="round" /><text x="600" y="630" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#1B2A4A">The family is the most important agent, especially for children; the others continue the work for life</text>
</svg>
