<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Harlow's wire mother and cloth mother</title>
  <desc id="desc">Isolated infant monkeys took milk from the wire mother but spent far more time clinging to the cloth mother.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#147D79" stroke="none"/>
    </marker>
    <marker id="arrow-gold" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#A47712" stroke="none"/>
    </marker>
    <marker id="arrow-coral" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#C65D4B" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#FCFCFA"/>
  <text x="600" y="56" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#1B2A4A">HARLOW’S ARTIFICIAL MOTHERS</text><rect x="170" y="130" width="320" height="380" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><text x="330" y="185" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#6F7985">Wire mother</text><line x1="230" y1="230" x2="230" y2="420" stroke="#9AA3AE" stroke-width="3" stroke-linecap="round"/><line x1="270" y1="230" x2="270" y2="420" stroke="#9AA3AE" stroke-width="3" stroke-linecap="round"/><line x1="310" y1="230" x2="310" y2="420" stroke="#9AA3AE" stroke-width="3" stroke-linecap="round"/><line x1="350" y1="230" x2="350" y2="420" stroke="#9AA3AE" stroke-width="3" stroke-linecap="round"/><line x1="390" y1="230" x2="390" y2="420" stroke="#9AA3AE" stroke-width="3" stroke-linecap="round"/><line x1="430" y1="230" x2="430" y2="420" stroke="#9AA3AE" stroke-width="3" stroke-linecap="round"/><line x1="230" y1="230" x2="430" y2="230" stroke="#9AA3AE" stroke-width="3" stroke-linecap="round"/><line x1="230" y1="277" x2="430" y2="277" stroke="#9AA3AE" stroke-width="3" stroke-linecap="round"/><line x1="230" y1="324" x2="430" y2="324" stroke="#9AA3AE" stroke-width="3" stroke-linecap="round"/><line x1="230" y1="371" x2="430" y2="371" stroke="#9AA3AE" stroke-width="3" stroke-linecap="round"/><line x1="230" y1="418" x2="430" y2="418" stroke="#9AA3AE" stroke-width="3" stroke-linecap="round"/><circle cx="330" cy="300" r="16" fill="#A47712" stroke="none" stroke-width="2"/><text x="330" y="465" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B2A4A">Offers milk</text><text x="330" y="495" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#25313D">Visited to feed, then left</text><rect x="710" y="130" width="320" height="380" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><text x="870" y="185" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#147D79">Cloth mother</text><rect x="770" y="225" width="200" height="200" rx="60" fill="#EAF6F5" stroke="#147D79" stroke-width="5" /><circle cx="870" cy="210" r="42" fill="#EAF6F5" stroke="#147D79" stroke-width="5"/><text x="870" y="465" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B2A4A">Offers no milk</text><text x="870" y="495" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="500" fill="#25313D">Clung to for most of the day</text><rect x="100.0" y="555" width="1000" height="58" rx="18" fill="#FFF7E3" stroke="#A47712" stroke-width="2" /><text x="600" y="594" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B2A4A">Attachment grew from the need for warmth, comfort, and intimacy, not from the need for milk</text>
</svg>
