<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Five probability-sampling strategies</title>
  <desc id="desc">Simple random selects scattered individuals. Systematic selects individuals at a regular interval. Stratified selects individuals from every subgroup. Cluster selects entire groups. Multistage selects groups and then individuals within those groups.</desc>
  <style>
    .panel { fill: #fffdf8; stroke: #c9ced6; stroke-width: 2; rx: 14; }
    .head { fill: #1b2a4a; }
    .label { font: 700 21px Arial, sans-serif; fill: #ffffff; text-anchor: middle; }
    .sub { font: 600 15px Arial, sans-serif; fill: #1b2a4a; text-anchor: middle; }
    .dot { fill: #d7dbe0; stroke: #8c96a3; stroke-width: 1.3; }
    .selected { fill: #e9c46a; stroke: #1b2a4a; stroke-width: 1.6; }
    .cluster { fill: none; stroke: #9aa3ad; stroke-width: 2; stroke-dasharray: 5 5; }
    .chosen { fill: none; stroke: #e9a923; stroke-width: 4; }
    .arrow { fill: none; stroke: #2a9d8f; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .legend { font: 600 15px Arial, sans-serif; fill: #1b2a4a; }
  </style>

  <!-- Panel backgrounds and headings -->
  <g>
    <rect class="panel" x="10" y="10" width="224" height="450"/>
    <rect class="head" x="10" y="10" width="224" height="56" rx="14"/>
    <text class="label" x="122" y="45">Simple random</text>

    <rect class="panel" x="249" y="10" width="224" height="450"/>
    <rect class="head" x="249" y="10" width="224" height="56" rx="14"/>
    <text class="label" x="361" y="45">Systematic</text>

    <rect class="panel" x="488" y="10" width="224" height="450"/>
    <rect class="head" x="488" y="10" width="224" height="56" rx="14"/>
    <text class="label" x="600" y="45">Stratified</text>

    <rect class="panel" x="727" y="10" width="224" height="450"/>
    <rect class="head" x="727" y="10" width="224" height="56" rx="14"/>
    <text class="label" x="839" y="45">Cluster</text>

    <rect class="panel" x="966" y="10" width="224" height="450"/>
    <rect class="head" x="966" y="10" width="224" height="56" rx="14"/>
    <text class="label" x="1078" y="45">Multistage</text>
  </g>

  <!-- Simple random: scattered individuals -->
  <g>
    <circle class="dot" cx="58" cy="111" r="9"/><circle class="selected" cx="101" cy="96" r="9"/>
    <circle class="dot" cx="146" cy="117" r="9"/><circle class="dot" cx="194" cy="98" r="9"/>
    <circle class="selected" cx="77" cy="155" r="9"/><circle class="dot" cx="123" cy="149" r="9"/>
    <circle class="selected" cx="174" cy="158" r="9"/><circle class="dot" cx="47" cy="207" r="9"/>
    <circle class="dot" cx="96" cy="198" r="9"/><circle class="selected" cx="143" cy="212" r="9"/>
    <circle class="dot" cx="201" cy="203" r="9"/><circle class="selected" cx="64" cy="258" r="9"/>
    <circle class="dot" cx="114" cy="250" r="9"/><circle class="dot" cx="163" cy="267" r="9"/>
    <circle class="selected" cx="204" cy="251" r="9"/><circle class="dot" cx="43" cy="315" r="9"/>
    <circle class="selected" cx="90" cy="311" r="9"/><circle class="dot" cx="138" cy="326" r="9"/>
    <circle class="selected" cx="181" cy="309" r="9"/><circle class="dot" cx="113" cy="374" r="9"/>
    <text class="sub" x="122" y="424">Individuals chosen by chance</text>
  </g>

  <!-- Systematic: regular interval after a random start -->
  <g>
    <circle class="dot" cx="285" cy="112" r="9"/><circle class="dot" cx="323" cy="112" r="9"/><circle class="selected" cx="361" cy="112" r="9"/><circle class="dot" cx="399" cy="112" r="9"/><circle class="dot" cx="437" cy="112" r="9"/>
    <circle class="dot" cx="285" cy="166" r="9"/><circle class="dot" cx="323" cy="166" r="9"/><circle class="selected" cx="361" cy="166" r="9"/><circle class="dot" cx="399" cy="166" r="9"/><circle class="dot" cx="437" cy="166" r="9"/>
    <circle class="dot" cx="285" cy="220" r="9"/><circle class="dot" cx="323" cy="220" r="9"/><circle class="selected" cx="361" cy="220" r="9"/><circle class="dot" cx="399" cy="220" r="9"/><circle class="dot" cx="437" cy="220" r="9"/>
    <circle class="dot" cx="285" cy="274" r="9"/><circle class="dot" cx="323" cy="274" r="9"/><circle class="selected" cx="361" cy="274" r="9"/><circle class="dot" cx="399" cy="274" r="9"/><circle class="dot" cx="437" cy="274" r="9"/>
    <circle class="dot" cx="285" cy="328" r="9"/><circle class="dot" cx="323" cy="328" r="9"/><circle class="selected" cx="361" cy="328" r="9"/><circle class="dot" cx="399" cy="328" r="9"/><circle class="dot" cx="437" cy="328" r="9"/>
    <text class="sub" x="361" y="400">Every kth case after</text>
    <text class="sub" x="361" y="420">a random start</text>
  </g>

  <!-- Stratified: selections from every stratum -->
  <g>
    <rect x="510" y="91" width="180" height="84" rx="10" fill="#2a9d8f" opacity="0.25"/>
    <rect x="510" y="190" width="180" height="84" rx="10" fill="#e9c46a" opacity="0.35"/>
    <rect x="510" y="289" width="180" height="84" rx="10" fill="#e76f51" opacity="0.25"/>
    <circle class="selected" cx="538" cy="120" r="9"/><circle class="dot" cx="570" cy="120" r="9"/><circle class="dot" cx="602" cy="120" r="9"/><circle class="selected" cx="634" cy="120" r="9"/><circle class="dot" cx="666" cy="120" r="9"/>
    <circle class="dot" cx="538" cy="149" r="9"/><circle class="dot" cx="570" cy="149" r="9"/><circle class="selected" cx="602" cy="149" r="9"/><circle class="dot" cx="634" cy="149" r="9"/><circle class="dot" cx="666" cy="149" r="9"/>
    <circle class="dot" cx="538" cy="219" r="9"/><circle class="selected" cx="570" cy="219" r="9"/><circle class="dot" cx="602" cy="219" r="9"/><circle class="dot" cx="634" cy="219" r="9"/><circle class="selected" cx="666" cy="219" r="9"/>
    <circle class="selected" cx="538" cy="248" r="9"/><circle class="dot" cx="570" cy="248" r="9"/><circle class="dot" cx="602" cy="248" r="9"/><circle class="dot" cx="634" cy="248" r="9"/><circle class="dot" cx="666" cy="248" r="9"/>
    <circle class="dot" cx="538" cy="318" r="9"/><circle class="dot" cx="570" cy="318" r="9"/><circle class="selected" cx="602" cy="318" r="9"/><circle class="dot" cx="634" cy="318" r="9"/><circle class="selected" cx="666" cy="318" r="9"/>
    <circle class="selected" cx="538" cy="347" r="9"/><circle class="dot" cx="570" cy="347" r="9"/><circle class="dot" cx="602" cy="347" r="9"/><circle class="dot" cx="634" cy="347" r="9"/><circle class="dot" cx="666" cy="347" r="9"/>
    <text class="sub" x="600" y="415">Some cases selected</text>
    <text class="sub" x="600" y="435">from every stratum</text>
  </g>

  <!-- Cluster: entire groups selected -->
  <g>
    <circle class="cluster" cx="784" cy="132" r="47"/><circle class="cluster" cx="894" cy="132" r="47"/>
    <circle class="chosen" cx="784" cy="246" r="47"/><circle class="cluster" cx="894" cy="246" r="47"/>
    <circle class="cluster" cx="784" cy="360" r="47"/><circle class="chosen" cx="894" cy="360" r="47"/>
    <!-- Gray groups -->
    <circle class="dot" cx="770" cy="118" r="7"/><circle class="dot" cx="798" cy="118" r="7"/><circle class="dot" cx="770" cy="146" r="7"/><circle class="dot" cx="798" cy="146" r="7"/>
    <circle class="dot" cx="880" cy="118" r="7"/><circle class="dot" cx="908" cy="118" r="7"/><circle class="dot" cx="880" cy="146" r="7"/><circle class="dot" cx="908" cy="146" r="7"/>
    <circle class="dot" cx="880" cy="232" r="7"/><circle class="dot" cx="908" cy="232" r="7"/><circle class="dot" cx="880" cy="260" r="7"/><circle class="dot" cx="908" cy="260" r="7"/>
    <circle class="dot" cx="770" cy="346" r="7"/><circle class="dot" cx="798" cy="346" r="7"/><circle class="dot" cx="770" cy="374" r="7"/><circle class="dot" cx="798" cy="374" r="7"/>
    <!-- Entire selected groups -->
    <circle class="selected" cx="770" cy="232" r="7"/><circle class="selected" cx="798" cy="232" r="7"/><circle class="selected" cx="770" cy="260" r="7"/><circle class="selected" cx="798" cy="260" r="7"/>
    <circle class="selected" cx="880" cy="346" r="7"/><circle class="selected" cx="908" cy="346" r="7"/><circle class="selected" cx="880" cy="374" r="7"/><circle class="selected" cx="908" cy="374" r="7"/>
    <text class="sub" x="839" y="430">Whole groups selected</text>
  </g>

  <!-- Multistage: groups first, then individuals -->
  <g>
    <circle class="chosen" cx="1026" cy="125" r="39"/><circle class="cluster" cx="1128" cy="125" r="39"/>
    <circle class="cluster" cx="1026" cy="222" r="39"/><circle class="chosen" cx="1128" cy="222" r="39"/>
    <circle class="dot" cx="1014" cy="113" r="6"/><circle class="dot" cx="1038" cy="113" r="6"/><circle class="dot" cx="1014" cy="137" r="6"/><circle class="dot" cx="1038" cy="137" r="6"/>
    <circle class="dot" cx="1116" cy="113" r="6"/><circle class="dot" cx="1140" cy="113" r="6"/><circle class="dot" cx="1116" cy="137" r="6"/><circle class="dot" cx="1140" cy="137" r="6"/>
    <circle class="dot" cx="1014" cy="210" r="6"/><circle class="dot" cx="1038" cy="210" r="6"/><circle class="dot" cx="1014" cy="234" r="6"/><circle class="dot" cx="1038" cy="234" r="6"/>
    <circle class="dot" cx="1116" cy="210" r="6"/><circle class="dot" cx="1140" cy="210" r="6"/><circle class="dot" cx="1116" cy="234" r="6"/><circle class="dot" cx="1140" cy="234" r="6"/>
    <path class="arrow" d="M1077 266 L1077 298 M1065 287 L1077 300 L1089 287"/>
    <circle class="chosen" cx="1026" cy="352" r="39"/><circle class="chosen" cx="1128" cy="352" r="39"/>
    <circle class="selected" cx="1014" cy="340" r="6"/><circle class="dot" cx="1038" cy="340" r="6"/><circle class="dot" cx="1014" cy="364" r="6"/><circle class="selected" cx="1038" cy="364" r="6"/>
    <circle class="dot" cx="1116" cy="340" r="6"/><circle class="selected" cx="1140" cy="340" r="6"/><circle class="selected" cx="1116" cy="364" r="6"/><circle class="dot" cx="1140" cy="364" r="6"/>
    <text class="sub" x="1078" y="423">Groups, then cases</text>
  </g>

  <!-- Legend -->
  <g transform="translate(474 490)">
    <circle class="selected" cx="0" cy="0" r="8"/>
    <text class="legend" x="15" y="5">selected</text>
    <circle class="dot" cx="112" cy="0" r="8"/>
    <text class="legend" x="127" y="5">not selected</text>
  </g>
</svg>
