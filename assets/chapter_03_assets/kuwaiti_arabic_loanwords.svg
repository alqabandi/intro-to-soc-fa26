<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Loanwords in Kuwaiti Arabic</title>
  <desc id="desc">Four cards connect seeda to Hindi and Urdu, dareesha to Persian, jooti to Hindi, and banchar to English.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#FCFCFA"/>
  <text x="600" y="62" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#1B2A4A">HOW MANY LANGUAGES ARE HIDING INSIDE KUWAITI ARABIC?</text><rect x="45" y="130" width="240" height="350" rx="24" fill="#FFFFFF" stroke="#147D79" stroke-width="5" filter="url(#shadow)"/><text x="165" y="215" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#147D79">SEEDA</text><text x="165" y="280" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#25313D">straight</text><line x1="100" y1="325" x2="230" y2="325" stroke="#147D79" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="165" y="390" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1B2A4A">Hindi / Urdu</text><rect x="335" y="130" width="240" height="350" rx="24" fill="#FFFFFF" stroke="#A47712" stroke-width="5" filter="url(#shadow)"/><text x="455" y="215" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#A47712">DAREESHA</text><text x="455" y="280" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#25313D">window</text><line x1="390" y1="325" x2="520" y2="325" stroke="#A47712" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="455" y="390" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1B2A4A">Persian</text><rect x="625" y="130" width="240" height="350" rx="24" fill="#FFFFFF" stroke="#C65D4B" stroke-width="5" filter="url(#shadow)"/><text x="745" y="215" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#C65D4B">JOOTI</text><text x="745" y="280" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#25313D">shoe</text><line x1="680" y1="325" x2="810" y2="325" stroke="#C65D4B" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="745" y="390" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1B2A4A">Hindi</text><rect x="915" y="130" width="240" height="350" rx="24" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="5" filter="url(#shadow)"/><text x="1035" y="215" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#1B2A4A">BANCHAR</text><text x="1035" y="280" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#25313D">flat tyre</text><line x1="970" y1="325" x2="1100" y2="325" stroke="#1B2A4A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="1035" y="390" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1B2A4A">English</text><rect x="275" y="535" width="650" height="62" rx="18" fill="#FFF7E3" stroke="#A47712" stroke-width="2" /><text x="600" y="576" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1B2A4A">Trade and migration leave traces in ordinary speech.</text>
</svg>
