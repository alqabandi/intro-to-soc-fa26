="url(#shadow)"/><rect x="905" y="75" width="260" height="10" rx="5" fill="#1B2A4A" stroke="none" stroke-width="0" /><text x="1035.0" y="133" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1B2A4A">MOBILITY</text><text x="1035.0" y="180" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="#25313D"><tspan x="1035.0" dy="0">wanait</tspan><tspan x="1035.0" dy="30">roads · routines</tspan></text><path d="M 118 420 L 212 420 L 194 486 L 136 486 Z" fill="#FFF7E3" stroke="#A47712" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><path d="M 145 402 C 115 360 180 345 148 300 C 125 267 176 245 157 208" fill="none" stroke="#A47712" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M 185 402 C 222 360 164 340 198 300 C 225 268 180 242 205 205" fill="none" stroke="#A47712" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M 382 350 C 382 280 496 280 496 350 L 488 455 L 392 455 Z" fill="#EAF6F5" stroke="#147D79" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><path d="M 496 320 C 550 312 554 350 520 367" fill="none" stroke="#147D79" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><path d="M 410 282 L 438 235 L 470 282" fill="none" stroke="#147D79" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><rect x="495" y="426" width="52" height="28" rx="8" fill="#EAF6F5" stroke="#147D79" stroke-width="5" /><rect x="682" y="206" width="126" height="280" rx="20" fill="#EEF2F7" stroke="#C65D4B" stroke-width="6" /><rect x="700" y="260" width="90" height="58" rx="13" fill="#FFFFFF" stroke="#C65D4B" stroke-width="2" /><text x="745" y="298" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#C65D4B">ambaih!</text><rect x="700" y="334" width="90" height="58" rx="13" fill="#FFFFFF" stroke="#147D79" stroke-width="2" /><text x="745" y="372" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#147D79">seeda</text><circle cx="745" cy="455" r="10" fill="#C65D4B" stroke="none" stroke-width="2"/><path d="M 950 400 L 982 327 L 1058 327 L 1090 366 L 1140 377 L 1140 430 L 950 430 Z" fill="#EEF2F7" stroke="#1B2A4A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><line x1="950" y1="365" x2="1012" y2="365" stroke="#1B2A4A" stroke-width="6" stroke-linecap="round"/><circle cx="995" cy="438" r="25" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="7"/><circle cx="1095" cy="438" r="25" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="7"/><text x="600" y="615" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#1B2A4A">Culture is visible in what people use, say, expect, and recognize.</text>
</svg>
