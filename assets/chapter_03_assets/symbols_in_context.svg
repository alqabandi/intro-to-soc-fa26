<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">One symbol in three contexts</title>
  <desc id="desc">A raised hand means requesting to speak in class, acknowledgement in greeting, and stop at a crossing.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#FCFCFA"/>
  <rect x="55" y="80" width="350" height="460" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="55" y="80" width="350" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><text x="230.0" y="138" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1B2A4A">CLASSROOM</text><circle cx="230" cy="275" r="86" fill="#EEF2F7" stroke="#147D79" stroke-width="5"/><path d="M 230 335 L 230 245 M 200 285 L 200 205 M 215 270 L 215 190 M 230 260 L 230 180 M 245 270 L 245 200 M 230 300 L 270 245" fill="none" stroke="#147D79" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><text x="230" y="450" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#1B2A4A">request to speak</text><rect x="425" y="80" width="350" height="460" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="425" y="80" width="350" height="10" rx="5" fill="#A47712" stroke="none" stroke-width="0" /><text x="600.0" y="138" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1B2A4A">GREETING</text><circle cx="600" cy="275" r="86" fill="#EEF2F7" stroke="#A47712" stroke-width="5"/><path d="M 600 335 L 600 245 M 570 285 L 570 205 M 585 270 L 585 190 M 600 260 L 600 180 M 615 270 L 615 200 M 600 300 L 640 245" fill="none" stroke="#A47712" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><text x="600" y="450" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#1B2A4A">acknowledgement</text><rect x="795" y="80" width="350" height="460" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="795" y="80" width="350" height="10" rx="5" fill="#C65D4B" stroke="none" stroke-width="0" /><text x="970.0" y="138" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1B2A4A">CROSSING</text><circle cx="970" cy="275" r="86" fill="#EEF2F7" stroke="#C65D4B" stroke-width="5"/><path d="M 970 335 L 970 245 M 940 285 L 940 205 M 955 270 L 955 190 M 970 260 L 970 180 M 985 270 L 985 200 M 970 300 L 1010 245" fill="none" stroke="#C65D4B" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" /><text x="970" y="450" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#1B2A4A">stop</text><text x="600" y="610" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" fill="#6F7985">The object stays the same; the social context changes its meaning.</text>
</svg>
