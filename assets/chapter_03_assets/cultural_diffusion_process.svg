<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Cultural diffusion process</title>
  <desc id="desc">Sushi moves from one setting through travel, media, and trade and is adapted as take-out.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#FCFCFA"/>
  <rect x="45" y="105" width="350" height="390" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="45" y="105" width="350" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><text x="220.0" y="163" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1B2A4A">1 · SETTING</text><text x="220" y="440" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1B2A4A">sushi at the bar</text><rect x="425" y="105" width="350" height="390" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="425" y="105" width="350" height="10" rx="5" fill="#A47712" stroke="none" stroke-width="0" /><text x="600.0" y="163" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1B2A4A">2 · MOVEMENT</text><text x="600" y="440" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1B2A4A">media · travel · trade</text><rect x="805" y="105" width="350" height="390" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="805" y="105" width="350" height="10" rx="5" fill="#C65D4B" stroke="none" stroke-width="0" /><text x="980.0" y="163" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1B2A4A">3 · ADAPTATION</text><text x="980" y="440" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1B2A4A">sushi as take-out</text><rect x="135" y="250" width="170" height="45" rx="22" fill="#EEF2F7" stroke="#147D79" stroke-width="4" /><circle cx="180" cy="230" r="30" fill="#C65D4B" stroke="#1B2A4A" stroke-width="4"/><circle cx="260" cy="230" r="30" fill="#A47712" stroke="#1B2A4A" stroke-width="4"/><path d="M 500 290 C 535 240 575 340 610 285" fill="none" stroke="#A47712" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><circle cx="550" cy="230" r="24" fill="#FFF7E3" stroke="#A47712" stroke-width="4"/><path d="M 915 210 L 1045 210 L 1025 330 L 935 330 Z" fill="#FFFFFF" stroke="#C65D4B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><line x1="915" y1="210" x2="980" y2="170" stroke="#C65D4B" stroke-width="5" stroke-linecap="round"/><line x1="1045" y1="210" x2="980" y2="170" stroke="#C65D4B" stroke-width="5" stroke-linecap="round"/><line x1="980" y1="170" x2="980" y2="330" stroke="#C65D4B" stroke-width="4" stroke-linecap="round"/><line x1="395" y1="300" x2="420" y2="300" stroke="#1B2A4A" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="775" y1="300" x2="800" y2="300" stroke="#1B2A4A" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><text x="600" y="575" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" fill="#147D79">Diffusion moves cultural items—and may change them.</text>
</svg>
