<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Two ways to classify norms</title>
  <desc id="desc">Formal versus informal asks whether a rule is written; mores versus folkways asks how deeply society cares.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#FCFCFA"/>
  <rect x="75" y="80" width="1050" height="205" rx="24" fill="#EEF2F7" stroke="#1B2A4A" stroke-width="3" /><rect x="75" y="365" width="1050" height="205" rx="24" fill="#FFF7E3" stroke="#A47712" stroke-width="3" /><text x="125" y="137" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#6F7985">AXIS 1</text><text x="600" y="145" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" fill="#1B2A4A">Is the rule written with set penalties?</text><line x1="265" y1="220" x2="935" y2="220" stroke="#1B2A4A" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><text x="250" y="258" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#1B2A4A">FORMAL</text><text x="950" y="258" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#1B2A4A">INFORMAL</text><text x="125" y="422" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#6F7985">AXIS 2</text><text x="600" y="430" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="29" font-weight="700" fill="#A47712">How deeply does society care?</text><line x1="265" y1="505" x2="935" y2="505" stroke="#A47712" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><text x="250" y="543" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#A47712">MORES</text><text x="950" y="543" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#A47712">FOLKWAYS</text><text x="600" y="625" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#147D79">Every norm can be classified on both axes.</text>
</svg>
