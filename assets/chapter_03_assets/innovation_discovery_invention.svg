<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Innovation, discovery, and invention</title>
  <desc id="desc">Innovation branches into discovery, which shares an existing reality, and invention, which combines existing cultural items.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#FCFCFA"/>
  <rect x="410" y="40" width="380" height="105" rx="26" fill="#1B2A4A" stroke="#1B2A4A" stroke-width="0" filter="url(#shadow)"/><text x="600" y="108" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF">INNOVATION</text><line x1="600" y1="150" x2="315" y2="255" stroke="#1B2A4A" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="600" y1="150" x2="885" y2="255" stroke="#1B2A4A" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="70" y="260" width="490" height="285" rx="24" fill="#EAF6F5" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="70" y="260" width="490" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><text x="315.0" y="318" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1B2A4A">DISCOVERY</text><text x="315.0" y="365" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="#25313D"><tspan x="315.0" dy="0">Make known or share</tspan><tspan x="315.0" dy="30">an existing reality</tspan></text><rect x="640" y="260" width="490" height="285" rx="24" fill="#FFF7E3" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="640" y="260" width="490" height="10" rx="5" fill="#A47712" stroke="none" stroke-width="0" /><text x="885.0" y="318" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1B2A4A">INVENTION</text><text x="885.0" y="365" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="#25313D"><tspan x="885.0" dy="0">Combine existing cultural</tspan><tspan x="885.0" dy="30">items into a new form</tspan></text><text x="315" y="465" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#25313D">DNA structure · new moon</text><text x="885" y="465" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#25313D">automobile · television</text><text x="600" y="620" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="24" font-weight="600" fill="#6F7985">Both become culturally significant when knowledge is shared.</text>
</svg>
