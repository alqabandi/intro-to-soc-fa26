" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1B2A4A">CROSS</text><text x="600" y="473" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#25313D">Medicine</text><line x1="600" y1="325" x2="270" y2="465" stroke="#C9D1DC" stroke-width="4" stroke-linecap="round"/><circle cx="270" cy="465" r="70" fill="#FFFFFF" stroke="#147D79" stroke-width="5"/><text x="270" y="473" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1B2A4A">RINGS</text><text x="270" y="373" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#25313D">Marriage</text><line x1="600" y1="325" x2="270" y2="195" stroke="#C9D1DC" stroke-width="4" stroke-linecap="round"/><circle cx="270" cy="195" r="70" fill="#FFFFFF" stroke="#147D79" stroke-width="5"/><text x="270" y="203" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1B2A4A">TAG</text><text x="270" y="300" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#25313D">Names</text><rect x="380" y="600" width="440" height="42" rx="14" fill="#EAF6F5" stroke="#147D79" stroke-width="2" /><text x="600" y="629" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#147D79">Universal practice · variable expression</text>
