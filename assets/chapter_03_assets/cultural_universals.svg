<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Cultural universals</title>
  <desc id="desc">Cooking, visiting, trade, medicine, marriage, and personal names surround shared human needs; their expression varies.</desc>
