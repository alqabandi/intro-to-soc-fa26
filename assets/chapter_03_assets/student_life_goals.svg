<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Selected student life goals</title>
  <desc id="desc">Financial well-being rose from 42 percent in 1966 to 83 percent in 2018; environmental concern fluctuated; racial tolerance reached 49 percent in 2017.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#FCFCFA"/>
  <rect x="45" y="65" width="1110" height="155" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="45" y="65" width="1110" height="10" rx="5" fill="#A47712" stroke="none" stroke-width="0" /><text x="600.0" y="123" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1B2A4A">BEING VERY WELL-OFF FINANCIALLY</text><text x="175" y="178" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="39" font-weight="700" fill="#1B2A4A">42%</text><text x="175" y="210" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#6F7985">1966</text><line x1="290" y1="175" x2="930" y2="175" stroke="#A47712" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/><text x="1030" y="178" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="39" font-weight="700" fill="#A47712">83%</text><text x="1030" y="210" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#6F7985">2018</text><rect x="45" y="255" width="1110" height="155" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="45" y="255" width="1110" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><text x="600.0" y="313" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1B2A4A">HELP CLEAN UP THE ENVIRONMENT</text><line x1="230" y1="350" x2="600" y2="385" stroke="#147D79" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 10"/><line x1="600" y1="385" x2="970" y2="360" stroke="#147D79" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 10"/><circle cx="230" cy="365" r="12" fill="#147D79" stroke="none" stroke-width="2"/><text x="230" y="335" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#147D79">~46%</text><text x="230" y="412" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#6F7985">peak</text><circle cx="600" cy="385" r="12" fill="#147D79" stroke="none" stroke-width="2"/><text x="600" y="355" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#147D79">≤20%</text><text x="600" y="432" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#6F7985">1980s</text><circle cx="970" cy="372" r="12" fill="#147D79" stroke="none" stroke-width="2"/><text x="970" y="342" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#147D79">36%</text><text x="970" y="419" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#6F7985">2018</text><rect x="45" y="445" width="1110" height="135" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="45" y="445" width="1110" height="10" rx="5" fill="#C65D4B" stroke="none" stroke-width="0" /><text x="600.0" y="503" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1B2A4A">PROMOTE RACIAL TOLERANCE</text><text x="600" y="550" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="40" font-weight="700" fill="#C65D4B">49%  ·  2017</text><text x="600" y="625" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#6F7985">Only source-preserved values are shown; no missing years are inferred.</text>
</svg>
