<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Healthcare interpreting pathway</title>
  <desc id="desc">A patient, trained interpreter, and clinician are connected in a communication chain; 22 percent marks clinically significant mistakes in the cited Massachusetts cases.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#FCFCFA"/>
  <rect x="55" y="125" width="270" height="275" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="55" y="125" width="270" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><text x="190.0" y="183" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1B2A4A">PATIENT</text><rect x="465" y="125" width="270" height="275" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="465" y="125" width="270" height="10" rx="5" fill="#A47712" stroke="none" stroke-width="0" /><text x="600.0" y="183" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1B2A4A">INTERPRETER</text><rect x="875" y="125" width="270" height="275" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="875" y="125" width="270" height="10" rx="5" fill="#C65D4B" stroke="none" stroke-width="0" /><text x="1010.0" y="183" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1B2A4A">CLINICIAN</text><circle cx="190" cy="236.25" r="16.25" fill="#147D79" stroke="none" stroke-width="2"/><path d="M 190 257.5 L 190 305.0 M 160.0 277.5 L 190 265.0 L 220.0 277.5 M 190 305.0 L 165.0 342.5 M 190 305.0 L 215.0 342.5" fill="none" stroke="#147D79" stroke-width="8.75" stroke-linecap="round" stroke-linejoin="round" /><circle cx="570" cy="270" r="42" fill="#FFF7E3" stroke="#A47712" stroke-width="4"/><circle cx="630" cy="300" r="42" fill="#FFF7E3" stroke="#A47712" stroke-width="4"/><text x="600" y="295" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B2A4A">A ⇄ B</text><rect x="985" y="235" width="50" height="130" rx="8" fill="#C65D4B" stroke="none" stroke-width="0" /><rect x="945" y="275" width="130" height="50" rx="8" fill="#C65D4B" stroke="none" stroke-width="0" /><line x1="330" y1="265" x2="455" y2="265" stroke="#1B2A4A" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="745" y1="265" x2="865" y2="265" stroke="#1B2A4A" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/><text x="395" y="245" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#6F7985">meaning</text><text x="805" y="245" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#6F7985">meaning</text><rect x="320" y="465" width="560" height="105" rx="24" fill="#FFF7E3" stroke="#A47712" stroke-width="3" /><text x="420" y="530" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="43" font-weight="700" fill="#C65D4B">22%</text><text x="650" y="505" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#25313D"><tspan x="650" dy="0">clinically significant mistakes</tspan><tspan x="650" dy="30">in the cited Massachusetts cases</tspan></text><text x="600" y="625" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#147D79">Communication is part of clinical safety.</text>
</svg>
