<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Conflict-theory account of dominant ideology</title>
  <desc id="desc">Control of wealth and property influences religion, education, and media, which help shape definitions of normality.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#FCFCFA"/>
  <rect x="365" y="45" width="470" height="105" rx="24" fill="#1B2A4A" stroke="#1B2A4A" stroke-width="0" filter="url(#shadow)"/><text x="600" y="110" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" fill="#FFFFFF">WEALTH AND PROPERTY</text><line x1="600" y1="155" x2="600" y2="230" stroke="#1B2A4A" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="150" y="240" width="300" height="120" rx="22" fill="#FFFFFF" stroke="#147D79" stroke-width="5" filter="url(#shadow)"/><text x="300" y="315" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#147D79">RELIGION</text><line x1="300" y1="365" x2="600" y2="465" stroke="#147D79" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="450" y="240" width="300" height="120" rx="22" fill="#FFFFFF" stroke="#A47712" stroke-width="5" filter="url(#shadow)"/><text x="600" y="315" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#A47712">EDUCATION</text><line x1="600" y1="365" x2="600" y2="465" stroke="#A47712" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="750" y="240" width="300" height="120" rx="22" fill="#FFFFFF" stroke="#C65D4B" stroke-width="5" filter="url(#shadow)"/><text x="900" y="315" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#C65D4B">MEDIA</text><line x1="900" y1="365" x2="600" y2="465" stroke="#C65D4B" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="300" y="480" width="600" height="105" rx="24" fill="#EEF2F7" stroke="#1B2A4A" stroke-width="4" /><text x="600" y="525" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#6F7985">DEFINITIONS OF</text><text x="600" y="563" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#1B2A4A">WHAT COUNTS AS “NORMAL”</text><text x="600" y="625" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#147D79">Conflict-theory account</text>
</svg>
