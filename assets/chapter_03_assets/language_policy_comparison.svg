<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Comparison of language policies</title>
  <desc id="desc">Policy cards compare China and Tibet, Singapore, and Quebec and Canada, above an axis showing that language can unify and divide.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#FCFCFA"/>
  <rect x="45" y="80" width="350" height="455" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="45" y="80" width="350" height="10" rx="5" fill="#C65D4B" stroke="none" stroke-width="0" /><text x="220.0" y="138" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1B2A4A">CHINA / TIBET</text><rect x="425" y="80" width="350" height="455" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="425" y="80" width="350" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><text x="600.0" y="138" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1B2A4A">SINGAPORE</text><rect x="805" y="80" width="350" height="455" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="805" y="80" width="350" height="10" rx="5" fill="#A47712" stroke="none" stroke-width="0" /><text x="980.0" y="138" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1B2A4A">QUÉBEC / CANADA</text><text x="220" y="205" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#25313D"><tspan x="220" dy="0">Mandarin instruction</tspan><tspan x="220" dy="34">extended from high school</tspan><tspan x="220" dy="34">to elementary school</tspan></text><text x="600" y="205" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#25313D"><tspan x="600" dy="0">English is the medium</tspan><tspan x="600" dy="34">of instruction; students</tspan><tspan x="600" dy="34">study a mother tongue</tspan></text><text x="980" y="205" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" fill="#25313D"><tspan x="980" dy="0">French-language schooling</tspan><tspan x="980" dy="34">mandated in 1978</tspan><tspan x="980" dy="34">1995 vote: 50.5% remain</tspan></text><text x="220" y="450" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#C65D4B">one-language extension</text><text x="600" y="450" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#147D79">multilingual schooling</text><text x="980" y="450" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#A47712">language and unity</text><line x1="200" y1="590" x2="1000" y2="590" stroke="#1B2A4A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><text x="180" y="625" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#147D79">UNIFIES</text><text x="1020" y="625" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="700" fill="#C65D4B">DIVIDES</text><text x="600" y="625" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1B2A4A">Language policy can do both</text>
</svg>
