<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Culture as a tool kit</title>
  <desc id="desc">An open tool kit contains language, kinship, education, work, and etiquette.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#FCFCFA"/>
  <path d="M 250 250 L 950 250 L 880 570 L 320 570 Z" fill="#EEF2F7" stroke="#1B2A4A" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" /><rect x="430" y="120" width="340" height="150" rx="40" fill="#FFFFFF" stroke="#1B2A4A" stroke-width="7" /><rect x="490" y="175" width="220" height="95" rx="25" fill="#FCFCFA" stroke="#1B2A4A" stroke-width="6" /><text x="600" y="220" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#1B2A4A">CULTURE</text><rect x="347" y="300" width="86" height="185" rx="18" fill="#FFFFFF" stroke="#147D79" stroke-width="5" transform="rotate(-2 600 390)"/><circle cx="390" cy="340" r="17" fill="#147D79" stroke="none" stroke-width="2"/><text x="390" y="455" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B2A4A">Language</text><rect x="452" y="300" width="86" height="185" rx="18" fill="#FFFFFF" stroke="#A47712" stroke-width="5" transform="rotate(-2 600 390)"/><circle cx="495" cy="340" r="17" fill="#A47712" stroke="none" stroke-width="2"/><text x="495" y="455" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B2A4A">Kinship</text><rect x="557" y="300" width="86" height="185" rx="18" fill="#FFFFFF" stroke="#C65D4B" stroke-width="5" transform="rotate(-2 600 390)"/><circle cx="600" cy="340" r="17" fill="#C65D4B" stroke="none" stroke-width="2"/><text x="600" y="455" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B2A4A">Education</text><rect x="662" y="300" width="86" height="185" rx="18" fill="#FFFFFF" stroke="#147D79" stroke-width="5" transform="rotate(-2 600 390)"/><circle cx="705" cy="340" r="17" fill="#147D79" stroke="none" stroke-width="2"/><text x="705" y="455" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B2A4A">Work</text><rect x="767" y="300" width="86" height="185" rx="18" fill="#FFFFFF" stroke="#A47712" stroke-width="5" transform="rotate(-2 600 390)"/><circle cx="810" cy="340" r="17" fill="#A47712" stroke="none" stroke-width="2"/><text x="810" y="455" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B2A4A">Etiquette</text><text x="600" y="625" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" fill="#6F7985">Resources for acting in familiar situations</text>
</svg>
