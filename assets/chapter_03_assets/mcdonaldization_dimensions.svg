<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Four dimensions of McDonaldization</title>
  <desc id="desc">Efficiency, calculability, predictability, and control surround formal rationality; IKEA is given as an example.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#FCFCFA"/>
  <circle cx="600" cy="325" r="104" fill="#1B2A4A" stroke="none" stroke-width="2"/><text x="600" y="312" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF"><tspan x="600" dy="0">FORMAL</tspan><tspan x="600" dy="36">RATIONALITY</tspan></text><rect x="45" y="75" width="350" height="165" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="45" y="75" width="350" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><text x="220.0" y="133" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1B2A4A">EFFICIENCY</text><text x="220.0" y="180" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="#25313D"><tspan x="220.0" dy="0">fastest route</tspan><tspan x="220.0" dy="30">to a goal</tspan></text><line x1="395" y1="157" x2="500" y2="285" stroke="#147D79" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="805" y="75" width="350" height="165" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="805" y="75" width="350" height="10" rx="5" fill="#A47712" stroke="none" stroke-width="0" /><text x="980.0" y="133" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1B2A4A">CALCULABILITY</text><text x="980.0" y="180" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="#25313D"><tspan x="980.0" dy="0">quantity becomes</tspan><tspan x="980.0" dy="30">a measure of quality</tspan></text><line x1="805" y1="157" x2="700" y2="285" stroke="#A47712" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="45" y="410" width="350" height="165" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="45" y="410" width="350" height="10" rx="5" fill="#C65D4B" stroke="none" stroke-width="0" /><text x="220.0" y="468" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1B2A4A">PREDICTABILITY</text><text x="220.0" y="515" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="#25313D"><tspan x="220.0" dy="0">the same result</tspan><tspan x="220.0" dy="30">across settings</tspan></text><line x1="395" y1="492" x2="500" y2="365" stroke="#C65D4B" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="805" y="410" width="350" height="165" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="805" y="410" width="350" height="10" rx="5" fill="#1B2A4A" stroke="none" stroke-width="0" /><text x="980.0" y="468" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1B2A4A">CONTROL</text><text x="980.0" y="515" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="#25313D"><tspan x="980.0" dy="0">rules and technology</tspan><tspan x="980.0" dy="30">limit variation</tspan></text><line x1="805" y1="492" x2="700" y2="365" stroke="#1B2A4A" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="385" y="530" width="430" height="66" rx="18" fill="#FFF7E3" stroke="#A47712" stroke-width="2" /><text x="600" y="573" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B2A4A">IKEA: route · self-service · flat-pack</text>
</svg>
