    </marker>
  </defs>
  <rect width="1200" height="650" fill="#FCFCFA"/>
  <circle cx="600" cy="325" r="112" fill="#1B2A4A" stroke="none" stroke-width="2"/><text x="600" y="310" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF"><tspan x="600" dy="0">CULTURE</tspan><tspan x="600" dy="38">IN PRACTICE</tspan></text><rect x="60" y="75" width="370" height="170" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="60" y="75" width="370" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><text x="245.0" y="133" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1B2A4A">MEDICINE</text><text x="245.0" y="180" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="#25313D"><tspan x="245.0" dy="0">interpreting</tspan><tspan x="245.0" dy="30">diagnosis</tspan></text><line x1="430" y1="160" x2="500" y2="285" stroke="#147D79" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="770" y="75" width="370" height="170" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="770" y="75" width="370" height="10" rx="5" fill="#A47712" stroke="none" stroke-width="0" /><text x="955.0" y="133" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1B2A4A">ENGINEERING</text><text x="955.0" y="180" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="#25313D"><tspan x="955.0" dy="0">culture lag</tspan><tspan x="955.0" dy="30">design constraints</tspan></text><line x1="770" y1="160" x2="700" y2="285" stroke="#A47712" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="60" y="405" width="370" height="170" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="60" y="405" width="370" height="10" rx="5" fill="#C65D4B" stroke="none" stroke-width="0" /><text x="245.0" y="463" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1B2A4A">BUSINESS</text><text x="245.0" y="510" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="#25313D"><tspan x="245.0" dy="0">localization</tspan><tspan x="245.0" dy="30">market fit</tspan></text><line x1="430" y1="490" x2="500" y2="365" stroke="#C65D4B" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="770" y="405" width="370" height="170" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="770" y="405" width="370" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><text x="955.0" y="463" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#1B2A4A">COMPUTER SCIENCE</text><text x="955.0" y="510" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="500" fill="#25313D"><tspan x="955.0" dy="0">language · argot</tspan><tspan x="955.0" dy="30">online communities</tspan></text><line x1="770" y1="490" x2="700" y2="365" stroke="#147D79" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/><text x="600" y="620" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#6F7985">One chapter · four professional uses</text>
