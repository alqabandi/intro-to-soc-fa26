<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Culture applied across four majors</title>
  <desc id="desc">Medicine connects to interpreting and diagnosis, engineering to culture lag, business to localization, and computer science to language and online communities.</desc>
