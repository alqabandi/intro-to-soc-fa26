<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Culture lag timeline</title>
  <desc id="desc">Technology is introduced before nonmaterial rules and norms move through uncertainty toward adaptation.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#FCFCFA"/>
  <text x="75" y="145" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#147D79">MATERIAL</text><text x="75" y="180" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#6F7985">technology</text><line x1="270" y1="160" x2="1070" y2="160" stroke="#147D79" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="390" cy="160" r="24" fill="#147D79" stroke="none" stroke-width="2"/><text x="390" y="105" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#147D79">introduced</text><text x="75" y="365" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#A47712">NONMATERIAL</text><text x="75" y="400" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#6F7985">rules and norms</text><line x1="270" y1="380" x2="1070" y2="380" stroke="#A47712" stroke-width="12" stroke-linecap="round" marker-end="url(#arrow)"/><circle cx="650" cy="380" r="24" fill="#A47712" stroke="none" stroke-width="2"/><circle cx="930" cy="380" r="24" fill="#A47712" stroke="none" stroke-width="2"/><text x="650" y="325" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#A47712">uncertainty</text><text x="930" y="325" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#A47712">adaptation</text><path d="M 390 195 C 440 260 520 300 650 350" fill="none" stroke="#C65D4B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="12 10"/><rect x="390" y="490" width="420" height="90" rx="20" fill="#FFF7E3" stroke="#A47712" stroke-width="3" /><text x="600" y="530" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="27" font-weight="700" fill="#1B2A4A">CULTURE LAG</text><text x="600" y="562" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#6F7985">the interval between the two</text><text x="600" y="630" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#C65D4B">Technology arrives before shared rules are ready.</text>
</svg>
