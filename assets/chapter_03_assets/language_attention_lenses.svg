<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Language directs attention</title>
  <desc id="desc">Two vocabulary lenses highlight different details in the same scene.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#FCFCFA"/>
  <path d="M 100 485 Q 285 240 450 475 T 780 450 T 1110 470" fill="#EEF2F7" stroke="#147D79" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" /><circle cx="310" cy="305" r="175" fill="none" stroke="#1B2A4A" stroke-width="15"/><circle cx="890" cy="305" r="175" fill="none" stroke="#A47712" stroke-width="15"/><line x1="485" y1="305" x2="715" y2="305" stroke="#6F7985" stroke-width="10" stroke-linecap="round"/><text x="310" y="92" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#1B2A4A">Vocabulary A</text><text x="890" y="92" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#A47712">Vocabulary B</text><circle cx="230" cy="250" r="17" fill="#147D79" stroke="none" stroke-width="2"/><circle cx="230" cy="250" r="30" fill="none" stroke="#147D79" stroke-width="3"/><circle cx="355" cy="350" r="17" fill="#147D79" stroke="none" stroke-width="2"/><circle cx="355" cy="350" r="30" fill="none" stroke="#147D79" stroke-width="3"/><circle cx="820" cy="215" r="17" fill="#C65D4B" stroke="none" stroke-width="2"/><circle cx="820" cy="215" r="30" fill="none" stroke="#C65D4B" stroke-width="3"/><circle cx="935" cy="315" r="17" fill="#C65D4B" stroke="none" stroke-width="2"/><circle cx="935" cy="315" r="30" fill="none" stroke="#C65D4B" stroke-width="3"/><circle cx="860" cy="390" r="17" fill="#C65D4B" stroke="none" stroke-width="2"/><circle cx="860" cy="390" r="30" fill="none" stroke="#C65D4B" stroke-width="3"/><text x="600" y="575" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="25" font-weight="600" fill="#25313D"><tspan x="600" dy="0">Same scene</tspan><tspan x="600" dy="34">different details become easier to notice</tspan></text>
</svg>
