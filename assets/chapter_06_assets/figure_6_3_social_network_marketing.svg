<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">Figure 6-3: marketing online through social networks</title>
  <desc id="desc">Left: traditional advertising sends one-way messages from the advertiser through spot ads, mass mailings, and billboards to consumers. Right: on an online social network, the advertiser and consumers exchange messages in both directions, and consumers are linked to one another.</desc>
