<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Functionalist view of the media: five functions and one dysfunction</title>
  <desc id="desc">Six cards: entertain, socialize, enforce social norms, confer status, and promote consumption are functions; the narcotizing dysfunction, in which massive coverage leaves the audience numb and inactive, is a dysfunction.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
    <marker id="arrowstart" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto">
      <path d="M12,0 L0,6 L12,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#FCFCFA"/>
  <text x="600" y="56" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B2A4A">FUNCTIONALIST VIEW: WHAT THE MEDIA DO FOR SOCIETY</text><rect x="60" y="100" width="340" height="225" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="60" y="100" width="340" height="10" rx="5" fill="#A47712" stroke="none" stroke-width="0" /><text x="230.0" y="158" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B2A4A">Entertain</text><text x="230.0" y="205" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#25313D"><tspan x="230.0" dy="0">The obvious function:</tspan><tspan x="230.0" dy="28">occupying leisure time,</tspan><tspan x="230.0" dy="28">from comics to</tspan><tspan x="230.0" dy="28">online gaming</tspan></text><rect x="430" y="100" width="340" height="225" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="430" y="100" width="340" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><text x="600.0" y="158" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B2A4A">Socialize</text><text x="600.0" y="205" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#25313D"><tspan x="600.0" dy="0">A common, more or less</tspan><tspan x="600.0" dy="28">standardized view of</tspan><tspan x="600.0" dy="28">culture; a collective</tspan><tspan x="600.0" dy="28">experience</tspan></text><rect x="800" y="100" width="340" height="225" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="800" y="100" width="340" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><text x="970.0" y="158" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B2A4A">Enforce social norms</text><text x="970.0" y="205" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#25313D"><tspan x="970.0" dy="0">Showing what happens</tspan><tspan x="970.0" dy="28">to people who violate</tspan><tspan x="970.0" dy="28">society’s expectations</tspan></text><rect x="60" y="355" width="340" height="225" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="60" y="355" width="340" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><text x="230.0" y="413" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B2A4A">Confer status</text><text x="230.0" y="460" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#25313D"><tspan x="230.0" dy="0">Singling out one person</tspan><tspan x="230.0" dy="28">or issue from thousands</tspan><tspan x="230.0" dy="28">and making it</tspan><tspan x="230.0" dy="28">significant</tspan></text><rect x="430" y="355" width="340" height="225" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="430" y="355" width="340" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><text x="600.0" y="413" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B2A4A">Promote consumption</text><text x="600.0" y="460" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#25313D"><tspan x="600.0" dy="0">Advertising, product</tspan><tspan x="600.0" dy="28">placement, and global</tspan><tspan x="600.0" dy="28">brands encourage</tspan><tspan x="600.0" dy="28">buying</tspan></text><rect x="800" y="355" width="340" height="225" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="800" y="355" width="340" height="10" rx="5" fill="#C65D4B" stroke="none" stroke-width="0" /><text x="970.0" y="413" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#1B2A4A">Narcotizing dysfunction</text><text x="970.0" y="460" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#25313D"><tspan x="970.0" dy="0">So much coverage that</tspan><tspan x="970.0" dy="28">the audience grows numb</tspan><tspan x="970.0" dy="28">and fails to act</tspan></text><text x="600" y="628" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#6F7985">Lazarsfeld and Merton 1948; C. Wright 1986. Coral marks the dysfunction.</text>
</svg>
