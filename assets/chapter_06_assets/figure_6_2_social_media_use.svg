xt x="600" y="676" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#6F7985">Percent of U.S. adults who use each platform. Survey of January–February 2019 (Perrin and Anderson 2019).</text>
