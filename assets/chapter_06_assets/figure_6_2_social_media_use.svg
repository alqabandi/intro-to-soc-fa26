<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Figure 6-2: who uses social media</title>
  <desc id="desc">Percent of U.S. adults using Facebook and LinkedIn in 2019. Gender: men 63 and 29, women 75 and 24. Age: 18 to 29, 79 and 28; 30 to 49, 79 and 37; 50 to 64, 68 and 24; 65 plus, 46 and 11. Income: under 30,000 dollars, 69 and 10; 30,000 to 74,999, 72 and 26; 75,000 and over, 74 and 22. Education: high school or less, 61 and 9; some college, 75 and 26; college graduate, 74 and 51. Community: urban 73 and 33, suburban 69 and 30, rural 66 and 10.</desc>
