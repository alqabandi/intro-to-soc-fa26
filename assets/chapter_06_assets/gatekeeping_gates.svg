<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Gatekeeping: a series of gates narrows what reaches the public</title>
  <desc id="desc">Twelve possible stories narrow to seven past publishers and media owners, four past editors and programmers, and two past government in many countries; a banner notes that the Internet removes many gates but laws, providers, and search filters still channel what users see.</desc>
