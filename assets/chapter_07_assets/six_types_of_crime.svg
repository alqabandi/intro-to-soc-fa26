<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Six types of crime that sociologists distinguish</title>
  <desc id="desc">Six cards. Victimless crime: the willing exchange among adults of widely desired but illegal goods and services. Professional crime: crime pursued as a day-to-day occupation. Organized crime: a group that regulates relations among criminal enterprises. White-collar crime: illegal acts in the course of business, often by respectable people, including cybercrime. Hate crime: the victim is chosen for a group identity and hatred prompted the act. Transnational crime: crime across multiple national borders.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#FCFCFA"/>
  <text x="600" y="56" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B2A4A">SIX TYPES OF CRIME THAT SOCIOLOGISTS DISTINGUISH</text><rect x="60" y="100" width="340" height="225" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="60" y="100" width="340" height="10" rx="5" fill="#A47712" stroke="none" stroke-width="0" /><text x="230.0" y="158" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1B2A4A">Victimless crime</text><text x="230.0" y="205" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#25313D"><tspan x="230.0" dy="0">Willing exchange among</tspan><tspan x="230.0" dy="28">adults of widely desired</tspan><tspan x="230.0" dy="28">but illegal goods and</tspan><tspan x="230.0" dy="28">services</tspan></text><rect x="430" y="100" width="340" height="225" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="430" y="100" width="340" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><text x="600.0" y="158" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1B2A4A">Professional crime</text><text x="600.0" y="205" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#25313D"><tspan x="600.0" dy="0">Crime pursued as a</tspan><tspan x="600.0" dy="28">day-to-day occupation,</tspan><tspan x="600.0" dy="28">with skilled techniques</tspan><tspan x="600.0" dy="28">and status among criminals</tspan></text><rect x="800" y="100" width="340" height="225" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="800" y="100" width="340" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><text x="970.0" y="158" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1B2A4A">Organized crime</text><text x="970.0" y="205" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#25313D"><tspan x="970.0" dy="0">A group that regulates</tspan><tspan x="970.0" dy="28">relations among criminal</tspan><tspan x="970.0" dy="28">enterprises in illegal</tspan><tspan x="970.0" dy="28">activities</tspan></text><rect x="60" y="355" width="340" height="225" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="60" y="355" width="340" height="10" rx="5" fill="#1B2A4A" stroke="none" stroke-width="0" /><text x="230.0" y="413" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1B2A4A">White-collar crime</text><text x="230.0" y="460" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#25313D"><tspan x="230.0" dy="0">Illegal acts in the course</tspan><tspan x="230.0" dy="28">of business, often by</tspan><tspan x="230.0" dy="28">“respectable” people;</tspan><tspan x="230.0" dy="28">includes cybercrime</tspan></text><rect x="430" y="355" width="340" height="225" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="430" y="355" width="340" height="10" rx="5" fill="#C65D4B" stroke="none" stroke-width="0" /><text x="600.0" y="413" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1B2A4A">Hate crime</text><text x="600.0" y="460" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#25313D"><tspan x="600.0" dy="0">A crime in which the</tspan><tspan x="600.0" dy="28">victim is chosen for a</tspan><tspan x="600.0" dy="28">group identity and</tspan><tspan x="600.0" dy="28">hatred prompted the act</tspan></text><rect x="800" y="355" width="340" height="225" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="800" y="355" width="340" height="10" rx="5" fill="#C65D4B" stroke="none" stroke-width="0" /><text x="970.0" y="413" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1B2A4A">Transnational crime</text><text x="970.0" y="460" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" fill="#25313D"><tspan x="970.0" dy="0">Crime that occurs</tspan><tspan x="970.0" dy="28">across multiple</tspan><tspan x="970.0" dy="28">national borders</tspan></text><text x="600" y="628" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="500" fill="#6F7985">Sociologists classify crimes by how they are committed and how society views them.</text>
</svg>
