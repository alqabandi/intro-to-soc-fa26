<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Figure 7-5: states with more than 50 executions since 1976</title>
  <desc id="desc">Horizontal bars: Texas 568, Virginia 113, Oklahoma 112, Florida 99, Missouri 84, Georgia 75, Alabama 66, Ohio 56. States with 26 to 50 executions: South Carolina 43, North Carolina 43, Arizona 37, Arkansas 31, Louisiana 28.</desc>
