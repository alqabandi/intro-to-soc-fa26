<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="555" viewBox="0 0 1200 555" role="img" aria-labelledby="title desc">
  <title id="title">Milgram's shock generator</title>
  <desc id="desc">A strip of 30 switches running from 15 to 450 volts, shading from teal to coral. Callouts: at 45 volts every teacher received a sample shock; at 150 volts the learner cried out, Get me out of here; at 270 volts he screamed in agony; at 350 volts he fell silent; 450 volts was the maximum. The learner received no shocks, and the experimenter insisted that the teacher continue.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="555" fill="#FCFCFA"/>
  <text x="600" y="52" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#1B2A4A">MILGRAM’S “SHOCK GENERATOR”: 30 SWITCHES FROM 15 TO 450 VOLTS</text><rect x="52.0" y="215" width="28" height="76" rx="6" fill="#147D79" stroke="none" stroke-width="0" /><rect x="89.2" y="215" width="28" height="76" rx="6" fill="#1A7B77" stroke="none" stroke-width="0" /><rect x="126.4" y="215" width="28" height="76" rx="6" fill="#207A75" stroke="none" stroke-width="0" /><rect x="163.60000000000002" y="215" width="28" height="76" rx="6" fill="#267974" stroke="none" stroke-width="0" /><rect x="200.8" y="215" width="28" height="76" rx="6" fill="#2C7872" stroke="none" stroke-width="0" /><rect x="238.0" y="215" width="28" height="76" rx="6" fill="#327771" stroke="none" stroke-width="0" /><rect x="275.20000000000005" y="215" width="28" height="76" rx="6" fill="#38766F" stroke="none" stroke-width="0" /><rect x="312.40000000000003" y="215" width="28" height="76" rx="6" fill="#3E756D" stroke="none" stroke-width="0" /><rect x="349.6" y="215" width="28" height="76" rx="6" fill="#45746C" stroke="none" stroke-width="0" /><rect x="386.8" y="215" width="28" height="76" rx="6" fill="#4B736A" stroke="none" stroke-width="0" /><rect x="424.0" y="215" width="28" height="76" rx="6" fill="#517169" stroke="none" stroke-width="0" /><rect x="461.20000000000005" y="215" width="28" height="76" rx="6" fill="#577067" stroke="none" stroke-width="0" /><rect x="498.40000000000003" y="215" width="28" height="76" rx="6" fill="#5D6F65" stroke="none" stroke-width="0" /><rect x="535.6" y="215" width="28" height="76" rx="6" fill="#636E64" stroke="none" stroke-width="0" /><rect x="572.8000000000001" y="215" width="28" height="76" rx="6" fill="#696D62" stroke="none" stroke-width="0" /><rect x="610.0" y="215" width="28" height="76" rx="6" fill="#706C61" stroke="none" stroke-width="0" /><rect x="647.2" y="215" width="28" height="76" rx="6" fill="#766B5F" stroke="none" stroke-width="0" /><rect x="684.4000000000001" y="215" width="28" height="76" rx="6" fill="#7C6A5E" stroke="none" stroke-width="0" /><rect x="721.6" y="215" width="28" height="76" rx="6" fill="#82695C" stroke="none" stroke-width="0" /><rect x="758.8000000000001" y="215" width="28" height="76" rx="6" fill="#88685A" stroke="none" stroke-width="0" /><rect x="796.0" y="215" width="28" height="76" rx="6" fill="#8E6659" stroke="none" stroke-width="0" /><rect x="833.2" y="215" width="28" height="76" rx="6" fill="#946557" stroke="none" stroke-width="0" /><rect x="870.4000000000001" y="215" width="28" height="76" rx="6" fill="#9B6456" stroke="none" stroke-width="0" /><rect x="907.6" y="215" width="28" height="76" rx="6" fill="#A16354" stroke="none" stroke-width="0" /><rect x="944.8000000000001" y="215" width="28" height="76" rx="6" fill="#A76252" stroke="none" stroke-width="0" /><rect x="982.0000000000001" y="215" width="28" height="76" rx="6" fill="#AD6151" stroke="none" stroke-width="0" /><rect x="1019.2" y="215" width="28" height="76" rx="6" fill="#B3604F" stroke="none" stroke-width="0" /><rect x="1056.4" y="215" width="28" height="76" rx="6" fill="#B95F4E" stroke="none" stroke-width="0" /><rect x="1093.6000000000001" y="215" width="28" height="76" rx="6" fill="#BF5E4C" stroke="none" stroke-width="0" /><rect x="1130.8000000000002" y="215" width="28" height="76" rx="6" fill="#C65D4B" stroke="none" stroke-width="0" /><rect x="38" y="201" width="1134.8000000000002" height="104" rx="14" fill="none" stroke="#1B2A4A" stroke-width="3" /><line x1="140.4" y1="122" x2="140.4" y2="197" stroke="#A47712" stroke-width="3" stroke-linecap="round"/><text x="42" y="112" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1B2A4A">45 V: a sample shock given to every teacher</text><line x1="400.8" y1="178" x2="400.8" y2="197" stroke="#A47712" stroke-width="3" stroke-linecap="round"/><text x="400.8" y="168" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1B2A4A">150 V: “Get me out of here!”</text><line x1="698.4000000000001" y1="122" x2="698.4000000000001" y2="197" stroke="#A47712" stroke-width="3" stroke-linecap="round"/><text x="698.4000000000001" y="112" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1B2A4A">270 V: the learner screams in agony</text><line x1="896.8000000000001" y1="178" x2="896.8000000000001" y2="197" stroke="#A47712" stroke-width="3" stroke-linecap="round"/><text x="896.8000000000001" y="168" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1B2A4A">350 V: the learner falls silent</text><line x1="1144.8000000000002" y1="122" x2="1144.8000000000002" y2="197" stroke="#A47712" stroke-width="3" stroke-linecap="round"/><text x="1160" y="112" text-anchor="end" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#1B2A4A">450 V: the maximum</text><text x="66.0" y="327" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#6F7985">15</text><text x="140.4" y="327" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#6F7985">45</text><text x="400.8" y="327" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#6F7985">150</text><text x="698.4000000000001" y="327" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#6F7985">270</text><text x="884.4000000000001" y="327" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#6F7985">345</text><text x="1144.8000000000002" y="327" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#6F7985">450</text><text x="600" y="355" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#6F7985">volts</text><rect x="60" y="395" width="1080" height="100" rx="18" fill="#FFF7E3" stroke="#A47712" stroke-width="2" /><text x="600" y="433" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#1B2A4A"><tspan x="600" dy="0">The learner, Milgram’s associate, received no shocks. When a teacher hesitated, the experimenter</tspan><tspan x="600" dy="30">insisted: “The experiment requires that you continue.” “You have no other choice; you must go on.”</tspan></text><text x="600" y="530" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="500" fill="#6F7985">Milgram 1963, 1975. Instructor illustration; the 350-volt point falls between the 345- and 360-volt switches.</text>
</svg>
