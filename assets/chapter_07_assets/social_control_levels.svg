<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">Social control operates at every level of society</title>
  <desc id="desc">Five cards from small groups to the state: in the family we obey our parents because they are our parents; peer groups introduce informal norms such as dress codes; colleges establish standards for students; bureaucratic organizations impose a formal system of rules and regulations; government legislates and enforces social norms. A banner notes that sanctions run from informal, such as smiles and ridicule, to formal, such as fines and jail sentences.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="580" fill="#FCFCFA"/>
  <text x="600" y="56" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B2A4A">SOCIAL CONTROL OPERATES AT EVERY LEVEL OF SOCIETY</text><rect x="35" y="100" width="210" height="270" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="35" y="100" width="210" height="10" rx="5" fill="#A47712" stroke="none" stroke-width="0" /><text x="140.0" y="158" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1B2A4A">Family</text><text x="140.0" y="205" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" fill="#25313D"><tspan x="140.0" dy="0">We obey our</tspan><tspan x="140.0" dy="28">parents simply</tspan><tspan x="140.0" dy="28">because they are</tspan><tspan x="140.0" dy="28">our parents</tspan></text><rect x="265" y="100" width="210" height="270" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="265" y="100" width="210" height="10" rx="5" fill="#A47712" stroke="none" stroke-width="0" /><text x="370.0" y="158" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1B2A4A">Peer groups</text><text x="370.0" y="205" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" fill="#25313D"><tspan x="370.0" dy="0">Introduce us to</tspan><tspan x="370.0" dy="28">informal norms,</tspan><tspan x="370.0" dy="28">such as dress</tspan><tspan x="370.0" dy="28">codes</tspan></text><rect x="495" y="100" width="210" height="270" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="495" y="100" width="210" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><text x="600.0" y="158" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1B2A4A">Colleges</text><text x="600.0" y="205" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" fill="#25313D"><tspan x="600.0" dy="0">Establish the</tspan><tspan x="600.0" dy="28">standards they</tspan><tspan x="600.0" dy="28">expect of</tspan><tspan x="600.0" dy="28">students</tspan></text><rect x="725" y="100" width="210" height="270" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="725" y="100" width="210" height="10" rx="5" fill="#147D79" stroke="none" stroke-width="0" /><text x="830.0" y="158" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1B2A4A">Organizations</text><text x="830.0" y="205" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" fill="#25313D"><tspan x="830.0" dy="0">Workers meet a</tspan><tspan x="830.0" dy="28">formal system</tspan><tspan x="830.0" dy="28">of rules and</tspan><tspan x="830.0" dy="28">regulations</tspan></text><rect x="955" y="100" width="210" height="270" rx="24" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="2" filter="url(#shadow)"/><rect x="955" y="100" width="210" height="10" rx="5" fill="#1B2A4A" stroke="none" stroke-width="0" /><text x="1060.0" y="158" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#1B2A4A">Government</text><text x="1060.0" y="205" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="500" fill="#25313D"><tspan x="1060.0" dy="0">Legislates and</tspan><tspan x="1060.0" dy="28">enforces social</tspan><tspan x="1060.0" dy="28">norms</tspan></text><line x1="248" y1="235" x2="262" y2="235" stroke="#6F7985" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="478" y1="235" x2="492" y2="235" stroke="#6F7985" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="708" y1="235" x2="722" y2="235" stroke="#6F7985" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="938" y1="235" x2="952" y2="235" stroke="#6F7985" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="120" y1="420" x2="1080" y2="420" stroke="#1B2A4A" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><text x="120" y="455" text-anchor="start" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#6F7985">Small, intimate groups</text><text x="1080" y="455" text-anchor="end" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#6F7985">The state</text><rect x="70.0" y="490" width="1060" height="58" rx="18" fill="#EEF2F7" stroke="#1B2A4A" stroke-width="2" /><text x="600" y="529" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B2A4A">Sanctions run from informal (smiles, ridicule) to formal (fines, jail sentences).</text>
</svg>
