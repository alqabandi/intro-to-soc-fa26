<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Index crimes: the eight types the FBI tabulates each year</title>
  <desc id="desc">Two panels. Violent crimes against people: murder, rape, robbery, and assault. Property crimes: burglary, larceny-theft, motor vehicle theft, and arson. A banner notes that only crimes reported to law enforcement are counted and that white-collar crimes are not in the index.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#1B2A4A" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#1B2A4A" stroke="none"/>
    </marker>
  </defs>
  <rect width="1200" height="590" fill="#FCFCFA"/>
  <text x="600" y="56" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#1B2A4A">INDEX CRIMES: THE EIGHT TYPES THE FBI TABULATES EACH YEAR</text><rect x="60" y="95" width="510" height="380" rx="24" fill="#F9E9E6" stroke="#DDE3EA" stroke-width="2" /><text x="315" y="145" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#1B2A4A">Violent crimes against people</text><rect x="120" y="180" width="390" height="54" rx="14" fill="#FFFFFF" stroke="#C65D4B" stroke-width="2" /><text x="315" y="216" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#1B2A4A">Murder</text><rect x="120" y="250" width="390" height="54" rx="14" fill="#FFFFFF" stroke="#C65D4B" stroke-width="2" /><text x="315" y="286" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#1B2A4A">Rape</text><rect x="120" y="320" width="390" height="54" rx="14" fill="#FFFFFF" stroke="#C65D4B" stroke-width="2" /><text x="315" y="356" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#1B2A4A">Robbery</text><rect x="120" y="390" width="390" height="54" rx="14" fill="#FFFFFF" stroke="#C65D4B" stroke-width="2" /><text x="315" y="426" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#1B2A4A">Assault</text><rect x="630" y="95" width="510" height="380" rx="24" fill="#EAF6F5" stroke="#DDE3EA" stroke-width="2" /><text x="885" y="145" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="25" font-weight="700" fill="#1B2A4A">Property crimes</text><rect x="690" y="180" width="390" height="54" rx="14" fill="#FFFFFF" stroke="#147D79" stroke-width="2" /><text x="885" y="216" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#1B2A4A">Burglary</text><rect x="690" y="250" width="390" height="54" rx="14" fill="#FFFFFF" stroke="#147D79" stroke-width="2" /><text x="885" y="286" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#1B2A4A">Larceny-theft</text><rect x="690" y="320" width="390" height="54" rx="14" fill="#FFFFFF" stroke="#147D79" stroke-width="2" /><text x="885" y="356" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#1B2A4A">Motor vehicle theft</text><rect x="690" y="390" width="390" height="54" rx="14" fill="#FFFFFF" stroke="#147D79" stroke-width="2" /><text x="885" y="426" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#1B2A4A">Arson</text><rect x="60.0" y="500" width="1080" height="58" rx="18" fill="#FFF7E3" stroke="#A47712" stroke-width="2" /><text x="600" y="539" text-anchor="middle" font-family="Noto Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="700" fill="#1B2A4A">Only crimes reported to law enforcement are counted. White-collar crimes are not in the index.</text>
</svg>
